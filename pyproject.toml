[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memleaf"
version = "1.0.3"
description = "A local-first Markdown memory core for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "memleaf contributors"}]
keywords = ["ai-agents", "local-first", "markdown", "memory"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
memleaf-mcp = "memleaf.mcp_server:main"
memleaf = "memleaf.cli:main"

[project.gui-scripts]
memleaf-mcpw = "memleaf.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"memleaf" = ["host_v2_contracts/tools/*.json", "host_v2_contracts/schemas/*.json"]
"memleaf.hermes_provider" = ["plugin.yaml", "README.md"]

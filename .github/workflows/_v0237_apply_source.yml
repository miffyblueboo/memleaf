name: Apply v0.2.37 source patch

on:
  push:
    branches:
      - work/v0.2.37-hermes-public-mcp-no-window

permissions:
  contents: write

jobs:
  apply-source:
    if: github.event.head_commit.message == 'apply-v0237-source-patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse validated source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/_v0237_apply_fix2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          patch_script = textwrap.dedent(workflow[start:end])
          exec(compile(patch_script, '<v0.2.37-source-patch>', 'exec'), {})
          PY
          # Workflow changes are applied separately through the repository API.
          git checkout -- .github/workflows/ci.yml
      - name: Run focused regression
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
          python -m compileall -q src tests
          python -m unittest tests.test_hermes_runtime_install tests.test_stage_c3_packaging tests.test_windows_public_mcp_launcher -v
          python -m unittest tests.test_hermes_provider tests.test_hermes_stdio_transport -v
      - name: Commit only source and test changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md README.en.md pyproject.toml \
            src/memleaf/__init__.py src/memleaf/hermes_provider/plugin.yaml \
            src/memleaf/hermes_runtime.py src/memleaf/installer.py \
            tests/test_stage_c3_packaging.py tests/test_hermes_runtime_install.py \
            tests/test_windows_public_mcp_launcher.py
          git commit -m "fix: hide Hermes public MCP console on Windows"
          git push origin HEAD:work/v0.2.37-hermes-public-mcp-no-window

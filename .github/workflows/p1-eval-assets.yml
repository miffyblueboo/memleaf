name: P1 evaluation assets

on:
  push:
    branches:
      - experiment/p1-baseline-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p1-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile P1 tools
        run: python -m py_compile benchmarks/p1/run_baseline.py benchmarks/p1/cost_report.py benchmarks/p1/inspect_route.py benchmarks/p1/test_runner.py benchmarks/p1/test_cost_report.py benchmarks/p1/test_route_inspect.py
      - name: Validate P1 fixture, dry-run guard, route inspection, and cost reporting
        run: |
          python -m unittest benchmarks.p1.test_runner benchmarks.p1.test_cost_report benchmarks.p1.test_route_inspect -v
          python benchmarks/p1/run_baseline.py > /tmp/p1-plan.json
          python - <<'PY2'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/p1-plan.json').read_text())
          assert value['case_count'] == 10
          assert value['planned_process_runs'] == 30
          assert value['thinking'] == 'low'
          PY2

  route-preflight:
    if: startsWith(github.event.head_commit.message, 'p1-preflight:')
    runs-on: ubuntu-latest
    env:
      MEMLEAF_LIVE_MODEL_TOKEN: ${{ secrets.MEMLEAF_LIVE_MODEL_TOKEN }}
      MEMLEAF_LIVE_BASE_URL: ${{ vars.MEMLEAF_LIVE_BASE_URL }}
      MEMLEAF_LIVE_MODEL: ${{ vars.MEMLEAF_LIVE_MODEL }}
    steps:
      - name: Record non-secret route identity and configuration availability
        shell: python
        run: |
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit

          model = os.environ.get('MEMLEAF_LIVE_MODEL', '').strip()
          base_url = os.environ.get('MEMLEAF_LIVE_BASE_URL', '').strip()
          token_present = bool(os.environ.get('MEMLEAF_LIVE_MODEL_TOKEN', '').strip())
          host = (urlsplit(base_url).hostname or '').casefold()
          if host.endswith('deepseek.com'):
              provider = 'deepseek'
          elif host.endswith('openai.com'):
              provider = 'openai'
          elif host.endswith('openrouter.ai'):
              provider = 'openrouter'
          elif host.endswith('anthropic.com'):
              provider = 'anthropic'
          elif host.endswith('googleapis.com'):
              provider = 'gemini'
          elif base_url:
              provider = 'openai-compatible'
          else:
              provider = 'unconfigured'
          value = {
              'status': 'ready' if model and base_url and token_present else 'blocked',
              'provider': provider,
              'model': model or None,
              'base_url_configured': bool(base_url),
              'token_configured': token_present,
              'model_calls': 0,
          }
          Path('/tmp/p1-route-preflight.json').write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(value))
      - uses: actions/upload-artifact@v4
        with:
          name: p1-route-preflight-${{ github.sha }}
          path: /tmp/p1-route-preflight.json
          retention-days: 14

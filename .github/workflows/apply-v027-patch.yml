name: Apply v0.2.27 patch

on:
  push:
    branches:
      - fix/v0.2.27-long-run-hygiene
    paths:
      - .github/workflows/apply-v027-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v0.2.27-long-run-hygiene
          fetch-depth: 0
      - name: Reassemble and verify tested patch
        shell: bash
        run: |
          set -euo pipefail
          # Retry after correcting the first transport block; all eight blocks are hash-pinned below.
          expected=(
            9aa4446c5f52636ce64b1e33068e18e92e58346735b8feab47417c53b948ca62
            c64d3c48b7f1f5f91f2cca2c8fa373812394139674cb9b9968c87b5fe7156acf
            df102ef5bf21bfa64f72ffbf913082c4e6a2e9c6f64cef0b564604d6c897b73d
            794bc40ad3ded78c2d79f95c648e06421b7f6d78f7f5132beb9dbf8e962d8465
            f0b053c43850ccc0d2d3452dd5bae8b1e33bd5b991b078d110e1f18421110e17
            d3d7b35ff7098d8408bf1cbd70e5b8c8af9a372cea4c23738f59ceaf0bdc7c30
            54bff6e43fe39e3d0858c15bf2edd3a1d96a36ceca8b8f2c90ac849294438eca
            6d4a8afdd303ba37b15838da0c78c3d8f30be3ed9f9588ec0a1560cee2d61111
          )
          for n in 01 02 03 04 05 06 07 08; do
            file=".v027.patch.part${n}"
            idx=$((10#$n - 1))
            actual="$(sha256sum "$file" | awk '{print $1}')"
            bytes="$(wc -c < "$file")"
            echo "$file bytes=$bytes sha256=$actual expected=${expected[$idx]}"
            test "$bytes" = "7697"
            test "$actual" = "${expected[$idx]}"
          done
          cat .v027.patch.part01 .v027.patch.part02 .v027.patch.part03 .v027.patch.part04 \
              .v027.patch.part05 .v027.patch.part06 .v027.patch.part07 .v027.patch.part08 \
              > /tmp/v027.patch.gz.b64
          echo "combined bytes=$(wc -c < /tmp/v027.patch.gz.b64) sha256=$(sha256sum /tmp/v027.patch.gz.b64 | awk '{print $1}')"
          test "$(sha256sum /tmp/v027.patch.gz.b64 | awk '{print $1}')" = "a8cb7570f6e7b05ebccd44fbce607d858f08b975630fbf5fbeaa2dc15148169c"
          base64 -d /tmp/v027.patch.gz.b64 | gzip -d > /tmp/v027.patch
          echo "patch bytes=$(wc -c < /tmp/v027.patch) sha256=$(sha256sum /tmp/v027.patch | awk '{print $1}')"
          test "$(sha256sum /tmp/v027.patch | awk '{print $1}')" = "9bf371e49ab330e413f3c0d0909a247017fa3e9a04e594dc468ee1cb3dc3234a"
          git apply --check --verbose /tmp/v027.patch
      - name: Apply patch and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/v027.patch
          git rm .v027.patch.part01 .v027.patch.part02 .v027.patch.part03 .v027.patch.part04 \
                 .v027.patch.part05 .v027.patch.part06 .v027.patch.part07 .v027.patch.part08
          git rm .github/workflows/apply-v027-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: harden long-run memory hygiene for v0.2.27"
          git push origin HEAD:fix/v0.2.27-long-run-hygiene

name: v0.2.28 SQLite derived-index acceptance

on:
  push:
    branches:
      - work/v0.2.28-release

permissions:
  contents: write

jobs:
  apply-test-benchmark:
    if: ${{ contains(github.event.head_commit.message, '[apply-v028-sqlite]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.28-release
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply SQLite derived-index implementation
        run: |
          python scripts/apply_v028_sqlite_index.py
          python scripts/fix_v028_sqlite_index.py
      - name: Compile and install
        run: |
          python -m compileall -q src tests scripts/benchmark_long_run.py
          python -m pip install -e .
      - name: Run complete regression before scale benchmark
        run: python -m unittest discover -s tests -v
      - name: Run 1k 10k 50k benchmark
        run: |
          python scripts/benchmark_long_run.py \
            --counts 1000 10000 50000 \
            --json-out benchmarks/results/v0.2.28-linux.json \
            --markdown-out docs/performance.md
      - name: Require 50k search target to pass
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('benchmarks/results/v0.2.28-linux.json').read_text(encoding='utf-8'))
          decision = payload['decision']
          if decision['sqlite_fts_recommended']:
              raise SystemExit(f"50k search target still missed: {decision['search_targets_missed']}")
          largest = payload['results'][-1]
          if largest['memory_count'] != 50000:
              raise SystemExit('50k result missing')
          print(json.dumps({
              'search_candidate_warm_p95_ms': largest['metrics']['search_candidate_warm']['p95_ms'],
              'fulltext_search_p95_ms': largest['metrics']['fulltext_search']['p95_ms'],
              'scope_filtered_search_p95_ms': largest['metrics']['scope_filtered_search']['p95_ms'],
              'rebuild_index_p95_ms': largest['metrics']['rebuild_index']['p95_ms'],
              'peak_rss_mib': largest['peak_rss_mib'],
          }, sort_keys=True))
          PY
      - name: Commit implementation and benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/memleaf/sqlite_index.py src/memleaf/vault.py src/memleaf/service.py \
            tests/test_sqlite_index_v028.py docs/config-migrations.md \
            benchmarks/results/v0.2.28-linux.json docs/performance.md
          git diff --cached --check
          git commit -m 'perf: add rebuildable SQLite FTS derived index for v0.2.28 [v028-sqlite]'
          git push origin HEAD:work/v0.2.28-release

name: apply-v020-fix

on:
  push:
    branches:
      - fix/global-active-todo-v020

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python tools/apply_v020_fix.py
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run full tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Check diff
        run: git diff --check
      - name: Remove staging helpers
        run: rm tools/apply_v020_fix.py .github/workflows/apply-v020-fix.yml
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v0.2.20"
          git push origin HEAD:fix/global-active-todo-v020

name: Temporary maintainability refactor

on:
  push:
    branches:
      - maintenance/main-maintainability-20260910

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[maintainability-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve test classes after split target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_maintenance_refactor.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          stub_index = next(i for i, line in enumerate(lines) if line.lstrip().startswith("stub = f'\"\"\"Compatibility facade"))
          write_index = next(i for i in range(stub_index + 1, len(lines)) if lines[i].strip() == 'write(path, stub)')
          lines.insert(stub_index, '    postamble = "".join(lines[getattr(test_class, "end_lineno"):])')
          write_index += 1
          lines[write_index] = '    write(path, stub + "\\n" + postamble)'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Apply mechanical refactor
        run: python scripts/_maintenance_refactor.py
      - name: Repair Hermes module ownership boundaries
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          shared_path = Path('src/memleaf/hermes_provider/_shared.py')
          provider_path = Path('src/memleaf/hermes_provider/_provider.py')
          client_path = Path('src/memleaf/hermes_provider/_mcp_client.py')

          shared = shared_path.read_text(encoding='utf-8')
          tree = ast.parse(shared)
          node = next(
              item for item in tree.body
              if isinstance(item, ast.FunctionDef) and item.name == '_capture_policy_status'
          )
          lines = shared.splitlines(True)
          start = min([node.lineno, *(d.lineno for d in node.decorator_list)] or [node.lineno]) - 1
          end = node.end_lineno
          function_text = ''.join(lines[start:end]).rstrip()
          shared = ''.join(line for index, line in enumerate(lines) if not start <= index < end)
          shared_path.write_text(shared, encoding='utf-8')

          provider = provider_path.read_text(encoding='utf-8')
          marker = 'class MemleafMemoryProvider(MemoryProvider):'
          if marker not in provider:
              raise RuntimeError('provider class marker missing')
          provider = provider.replace(marker, function_text + '\n\n\n' + marker, 1)
          provider_path.write_text(provider, encoding='utf-8')

          client = client_path.read_text(encoding='utf-8')
          class_marker = '''class _MCPClient:\n    """Small synchronous JSON-RPC client for memleaf's stdio MCP server."""\n'''
          class_replacement = class_marker + '''\n    @staticmethod\n    def _creationflags() -> int:\n        """Return platform-specific flags owned by the MCP transport."""\n\n        return _mcp_creationflags()\n'''
          if class_marker not in client or 'creationflags=_mcp_creationflags(),' not in client:
              raise RuntimeError('MCP client launch shape changed')
          client = client.replace(class_marker, class_replacement, 1)
          client = client.replace('creationflags=_mcp_creationflags(),', 'creationflags=self._creationflags(),', 1)
          client_path.write_text(client, encoding='utf-8')

          windows_path = Path('tests/test_hermes_windows_subprocess.py')
          windows = windows_path.read_text(encoding='utf-8')
          old = '''        with (\n            patch.object(provider_module, "_mcp_creationflags", return_value=flag),\n            patch.object(provider_module.subprocess, "Popen", return_value=process) as popen,\n'''
          new = '''        with (\n            patch.object(provider_module._MCPClient, "_creationflags", return_value=flag),\n            patch.object(provider_module.subprocess, "Popen", return_value=process) as popen,\n'''
          if old not in windows:
              raise RuntimeError('Windows MCP patch target changed')
          windows_path.write_text(windows.replace(old, new, 1), encoding='utf-8')

          ast.parse(shared_path.read_text(encoding='utf-8'))
          ast.parse(provider_path.read_text(encoding='utf-8'))
          ast.parse(client_path.read_text(encoding='utf-8'))
          ast.parse(windows_path.read_text(encoding='utf-8'))
          PY
      - name: Install package
        run: python -m pip install -e .
      - name: Compile repository
        run: python -m compileall -q src tests examples
      - name: Run full Linux regression before staging commit
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'miffyblueboo'
          git config user.email 'miffyblueboo@gmail.com'
          git add -A
          git commit -m 'refactor: split oversized modules and remove benchmark assets [maintainability-applied]'
          git push origin HEAD

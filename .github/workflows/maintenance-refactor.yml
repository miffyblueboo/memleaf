name: Temporary maintainability refactor

on:
  push:
    branches:
      - maintenance/main-maintainability-20260910

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[maintainability-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Preserve test classes after split target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_maintenance_refactor.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          stub_index = next(i for i, line in enumerate(lines) if line.lstrip().startswith("stub = f'\"\"\"Compatibility facade"))
          write_index = next(i for i in range(stub_index + 1, len(lines)) if lines[i].strip() == 'write(path, stub)')
          lines.insert(stub_index, '    postamble = "".join(lines[getattr(test_class, "end_lineno"):])')
          write_index += 1
          lines[write_index] = '    write(path, stub + "\\n" + postamble)'
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Apply mechanical refactor
        run: python scripts/_maintenance_refactor.py
      - name: Install package
        run: python -m pip install -e .
      - name: Compile repository
        run: python -m compileall -q src tests examples
      - name: Run full Linux regression before staging commit
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'miffyblueboo'
          git config user.email 'miffyblueboo@gmail.com'
          git add -A
          git commit -m 'refactor: split oversized modules and remove benchmark assets [maintainability-applied]'
          git push origin HEAD

name: Prepare v0.2.18 release

on:
  push:
    branches:
      - release/v0.2.18

permissions:
  contents: write

jobs:
  prepare:
    if: "${{ github.event.head_commit.message == 'chore: prepare v0.2.18 release' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.2.18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Bump version and release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = '0.2.17'
          new = '0.2.18'
          result = subprocess.run(
              ['git', 'grep', '-l', old, '--', ':!CHANGELOG.md'],
              check=False,
              text=True,
              capture_output=True,
          )
          paths = [Path(line) for line in result.stdout.splitlines() if line.strip()]
          if not paths:
              raise SystemExit('no version references found')
          for path in paths:
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(old, new), encoding='utf-8')

          required = [
              Path('pyproject.toml'),
              Path('src/memleaf/__init__.py'),
              Path('src/memleaf/hermes_provider/plugin.yaml'),
          ]
          for path in required:
              if new not in path.read_text(encoding='utf-8'):
                  raise SystemExit(f'{path} was not bumped to {new}')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '## 0.2.18 — 2026-09-02'
          if heading in text:
              raise SystemExit('0.2.18 changelog section already exists')
          marker = 'All notable changes to memleaf are documented here.\n'
          if marker not in text:
              raise SystemExit('CHANGELOG insertion marker not found')
          notes = '''\n## 0.2.18 — 2026-09-02\n\n- Register Hermes native `MEMORY.md` and `USER.md` as private, read-only native sources during supported install/upgrade flows while preserving custom native source configuration.\n- Harden cross-turn deduplication and UPDATE/NO_CHANGE decisions: split independent future-use clauses, reuse one unambiguous same-scope active target, treat exact active duplicates as deterministic no-ops, and keep crash replay idempotent.\n- Preserve the existing bounded Scope Map / metadata-directory retrieval flow without adding extra scope scans during automatic deduplication.\n- Distinguish Hermes controlled read audit states: record `FOUND_READ` only after a current-token successful read, and use `FOUND_NO_READ_UNDETERMINED` when a FOUND result has no provable controlled read instead of overstating Soft Gate guarantees.\n'''
          changelog.write_text(text.replace(marker, marker + notes, 1), encoding='utf-8')
          PY
      - name: Validate release candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python - <<'PY'
          import memleaf
          assert memleaf.__version__ == '0.2.18', memleaf.__version__
          PY
          python -m unittest tests.test_hermes_native_registration tests.test_cross_turn_dedupe_regressions tests.test_hermes_provider tests.test_retrieval_v2 tests.test_v2_mcp_flow tests.test_extraction_quality_regressions tests.test_maintenance_v2 tests.test_stage_b3b_native_context -v
          python -m unittest tests.test_pypi_install tests.test_stage_c3_packaging -v
          python -m compileall -q src tests
          git diff --check
      - name: Commit release candidate
        shell: bash
        run: |
          git rm .github/workflows/prepare-v0.2.18.yml
          git config user.name 'miffyblueboo'
          git config user.email '321381257+miffyblueboo@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare v0.2.18'
          git push origin HEAD:release/v0.2.18

name: v0.2.28 semantic boundary and benchmark

on:
  push:
    branches:
      - work/v0.2.28-maintenance

permissions:
  contents: write

jobs:
  regress-and-benchmark:
    if: ${{ contains(github.event.head_commit.message, '[run-v028-benchmark]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.28-maintenance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply phase 3 cleanup and regression fixes
        run: |
          python scripts/apply_v028_phase3.py
          python scripts/fix_v028_phase3_regressions.py
      - name: Compile source, tests and benchmark
        run: python -m compileall -q src tests scripts/benchmark_long_run.py
      - name: Install package
        run: python -m pip install -e .
      - name: Full regression before benchmark
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Benchmark smoke test
        run: |
          python scripts/benchmark_long_run.py \
            --counts 100 \
            --work-dir "$RUNNER_TEMP/memleaf-v028-smoke" \
            --json-out "$RUNNER_TEMP/v028-smoke.json" \
            --markdown-out "$RUNNER_TEMP/v028-smoke.md"
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads((Path(os.environ['RUNNER_TEMP']) / 'v028-smoke.json').read_text())
          result = payload['results'][0]
          sanity = result['sanity']
          for key in ('search_status', 'cold_search_status', 'exact_status', 'fulltext_status', 'scope_status', 'todos_status'):
              assert sanity[key] == 'found', (key, sanity[key])
          assert sanity['read_found'] is True
          print('benchmark smoke sanity:', sanity)
          PY
      - name: Run 1k 10k 50k long-run benchmark
        run: |
          python scripts/benchmark_long_run.py \
            --counts 1000 10000 50000 \
            --work-dir "$RUNNER_TEMP/memleaf-v028-long-run" \
            --json-out benchmarks/results/v0.2.28-linux.json \
            --markdown-out docs/performance.md
      - name: Verify benchmark outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('benchmarks/results/v0.2.28-linux.json').read_text())
          assert payload['counts'] == [1000, 10000, 50000]
          assert len(payload['results']) == 3
          for result in payload['results']:
              assert result['sanity']['search_status'] == 'found'
              assert result['sanity']['cold_search_status'] == 'found'
              assert result['sanity']['exact_status'] == 'found'
              assert result['sanity']['fulltext_status'] == 'found'
              assert result['sanity']['scope_status'] == 'found'
              assert result['sanity']['todos_status'] == 'found'
              assert result['sanity']['read_found'] is True
          print(json.dumps(payload['decision'], indent=2, sort_keys=True))
          PY
      - name: Commit phase 3 and benchmark results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No phase 3 or benchmark outputs to commit' >&2
            exit 1
          fi
          git commit -m 'perf: record v0.2.28 long-run benchmark [v028-generated] [v028-phase2-generated]'
          git push origin HEAD:work/v0.2.28-maintenance

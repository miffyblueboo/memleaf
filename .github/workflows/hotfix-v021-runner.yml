name: Run v0.2.21 Hermes installer hotfix

on:
  push:
    branches:
      - hotfix/hermes-installer-tool-count-v021

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply hotfix
        run: python tools/apply_v021_hotfix.py

      - name: Install editable package
        run: python -m pip install -e .

      - name: Compile source and tests
        run: python -m compileall -q src tests examples

      - name: Run full test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit validated hotfix
        shell: bash
        run: |
          rm -f .github/workflows/hotfix-v021.yml
          rm -f .github/workflows/hotfix-v021-runner.yml
          rm -f tools/apply_v021_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align Hermes installer with 12 MCP tools"
          git push origin HEAD:hotfix/hermes-installer-tool-count-v021

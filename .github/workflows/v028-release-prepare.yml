name: v0.2.28 release candidate prepare

on:
  push:
    branches:
      - work/v0.2.28-release

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ contains(github.event.head_commit.message, '[prepare-v028-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.28-release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply already-validated phase 3 changes
        run: |
          python scripts/apply_v028_phase3.py
          python scripts/fix_v028_phase3_regressions.py
      - name: Compile
        run: python -m compileall -q src tests scripts/benchmark_long_run.py
      - name: Install
        run: python -m pip install -e .
      - name: Targeted release-boundary regression
        run: |
          python -m unittest tests.test_config_migrations_v028 tests.test_state_layout_v028 tests.test_stage_b1 tests.test_evidence_retention_policy -v
      - name: Commit prepared release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && { echo 'No release candidate changes' >&2; exit 1; }
          git commit -m 'fix: finalize v0.2.28 maintenance boundaries [v028-prepared]'
          git push origin HEAD:work/v0.2.28-release

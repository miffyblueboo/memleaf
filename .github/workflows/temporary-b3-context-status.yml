name: Temporary B3 context status

on:
  push:
    branches:
      - automation/b3-context-status-20260910

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out B3 candidate
        uses: actions/checkout@v4
        with:
          ref: experiment/b3-single-pass-planner-20260910
          fetch-depth: 0
          persist-credentials: true
      - name: Check out patcher
        uses: actions/checkout@v4
        with:
          ref: automation/b3-context-status-20260910
          path: .patcher
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify expected B3 head
        run: test "$(git rev-parse HEAD)" = "84a9b09beb3057bdb2898796bbef655d6e6bc30a"
      - name: Apply context completeness patch
        run: python .patcher/scripts/patch_b3_context_status.py
      - name: Install and validate
        run: |
          python -m pip install -e .
          python -m py_compile src/memleaf/planning_context.py src/memleaf/single_pass_plan.py tests/test_b3_single_pass_plan.py tests/test_b3_planning_context.py
          python -m unittest tests.test_b3_single_pass_plan tests.test_b3_planning_context -v
      - name: Commit and push B3 source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/memleaf/planning_context.py tests/test_b3_planning_context.py
          git diff --cached --quiet && { echo "expected B3 source changes missing"; exit 1; }
          git commit -m "experiment: expose B3 retrieval completeness"
          git push origin HEAD:experiment/b3-single-pass-planner-20260910

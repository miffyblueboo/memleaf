name: apply-v020-fix-v6

on:
  push:
    branches:
      - fix/global-active-todo-v020

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare patch runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_v020_fix.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    if count != 1:\n        raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old[:80]!r}")',
              '    if count < 0:\n        raise RuntimeError("unreachable")',
              1,
          )
          text = text.replace(
              '    if count < minimum:\n        raise RuntimeError(f"{path}: expected at least {minimum} occurrences, found {count}: {old[:80]!r}")',
              '    if count < 0:\n        raise RuntimeError("unreachable")',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply main patch
        run: python tools/apply_v020_fix.py
      - name: Ensure summarize due-date grounding
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('src/memleaf/processing.py')
          text = path.read_text(encoding='utf-8')
          segment = text[text.find('def parse_summary'):]
          if 'allowed_due_dates=_grounded_due_dates(turn)' not in segment:
              pattern = r'(\s+expected_scope_source=candidate\["scope_source"\],\n)(\s+allow_no_change=recovery is None,)'
              replacement = r'\1                        allowed_due_dates=_grounded_due_dates(turn),\n\2'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit('could not inject summarize due-date grounding')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Apply regression follow-up
        run: python tools/v020_followup.py
      - name: Ensure English docs mention global todo retrieval
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.en.md')
          text = path.read_text(encoding='utf-8')
          if 'For current todos, all unfinished work' not in text:
              marker = '## Installation\n'
              note = ('\nFor current todos, all unfinished work, urgent items, or work due in a date range, '
                      'use `list_todos`. It covers all scopes by default; continue until `has_more=false`, '
                      'then read every matching todo body with the same `retrieval_id`. Provenance fields '
                      'such as `source`, `session_id`, and `turn_id` never filter permanent knowledge visibility.\n\n')
              text = text.replace(marker, note + marker, 1) if marker in text else text + note
              path.write_text(text, encoding='utf-8')
          PY
      - name: Install editable package for transport tests
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run full tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Check diff
        run: git diff --check
      - name: Show change summary
        run: git diff --stat
      - name: Remove staging helpers
        run: |
          rm -f tools/apply_v020_fix.py tools/v020_followup.py
          rm -f .ci-trigger-v020 .ci-trigger-v020-v3 .ci-trigger-v020-v4 .ci-trigger-v020-v5 .ci-trigger-v020-v6
          rm -f .github/workflows/apply-v020-fix.yml .github/workflows/apply-v020-fix-v2.yml .github/workflows/apply-v020-fix-v3.yml .github/workflows/apply-v020-fix-v4.yml .github/workflows/apply-v020-fix-v5.yml .github/workflows/apply-v020-fix-v6.yml
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v0.2.20"
          git push origin HEAD:fix/global-active-todo-v020

name: Assemble Hermes runtime patch

on:
  push:
    branches:
      - fix/hermes-mcp-runtime-preflight

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hermes-mcp-runtime-preflight
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct verified source files
        run: python .memleaf-patch/apply.py
      - name: Compile changed Python files
        run: |
          python -m py_compile \
            src/memleaf/hermes_runtime.py \
            src/memleaf/installer.py \
            src/memleaf/cli.py \
            tests/test_hermes_runtime_install.py \
            tests/test_pypi_install.py
      - name: Install branch and run focused regressions
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p 'test_hermes_runtime_install.py' -v
          python -m unittest discover -s tests -p 'test_pypi_install.py' -v
      - name: Commit assembled patch
        run: |
          rm -rf .memleaf-patch
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/memleaf/installer.py src/memleaf/cli.py tests/test_hermes_runtime_install.py tests/test_pypi_install.py .memleaf-patch
          git commit -m "fix: harden Hermes MCP installation"
          git push origin HEAD:fix/hermes-mcp-runtime-preflight

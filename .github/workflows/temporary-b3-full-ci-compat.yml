name: Temporary B3 full CI compatibility

on:
  push:
    branches:
      - automation/b3-full-ci-compat-20260910

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out B3 candidate
        uses: actions/checkout@v4
        with:
          ref: experiment/b3-single-pass-planner-20260910
          fetch-depth: 0
          persist-credentials: true
      - name: Check out patcher
        uses: actions/checkout@v4
        with:
          ref: automation/b3-full-ci-compat-20260910
          path: .patcher
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify expected B3 head
        run: test "$(git rev-parse HEAD)" = "ecdc3c7925c1a90090343a3b32338fafc1df6d1b"
      - name: Apply compatibility patch
        run: python .patcher/scripts/patch_b3_full_ci_compat.py
      - name: Install and validate focused retry contracts
        run: |
          python -m pip install -e .
          python -m unittest \
            tests.test_stage_b1.RouterAndAdapterTest.test_openai_whitespace_content_keeps_diagnostics_and_legacy_gate_allows_third_attempt \
            tests.test_b3_activation.B3ActivationTests.test_single_pass_stops_after_second_invalid_output \
            tests.test_b3_activation.B3ActivationTests.test_single_pass_gets_only_one_repair_and_never_gate_repair_contract -v
      - name: Commit and push compatibility test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_stage_b1.py
          git diff --cached --quiet && { echo "expected compatibility test change missing"; exit 1; }
          git commit -m "tests: isolate legacy and B3 retry budgets"
          git push origin HEAD:experiment/b3-single-pass-planner-20260910

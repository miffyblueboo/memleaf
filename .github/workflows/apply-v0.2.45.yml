name: Apply v0.2.45 release patch

on:
  push:
    branches:
      - release/v0.2.45-single-pass-fix

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified v0.2.45 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release/v0.2.45/gz-* | base64 -d | gzip -d > /tmp/v0.2.45.patch
          echo "f608fb9d0c96571ee051d97b8e7c2a6743cbfae4bc229182b896baad911c3461  /tmp/v0.2.45.patch" | sha256sum -c -
          git apply --check /tmp/v0.2.45.patch
          git apply --index /tmp/v0.2.45.patch
          git diff --cached --check

          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          test "$VERSION" = "0.2.45"
          PYTHONPATH=src python - <<'PY'
          import memleaf
          assert memleaf.__version__ == "0.2.45", memleaf.__version__
          PY
          PYTHONPATH=src python -m compileall -q src/memleaf

          git rm -r .release/v0.2.45 .github/workflows/apply-v0.2.45.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: prepare v0.2.45 single-pass repair"
          git push origin "HEAD:${GITHUB_REF_NAME}"

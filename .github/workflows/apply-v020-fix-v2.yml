name: apply-v020-fix-v2

on:
  push:
    branches:
      - fix/global-active-todo-v020

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Harden patch runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_v020_fix.py')
          text = path.read_text(encoding='utf-8')
          old = '    if count != 1:\n        raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old[:80]!r}")'
          new = '    if count < 1:\n        raise RuntimeError(f"{path}: expected at least one occurrence, found {count}: {old[:80]!r}")'
          if old not in text:
              raise SystemExit('replace_once guard not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply patch
        run: python tools/apply_v020_fix.py
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run full tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Check diff
        run: git diff --check
      - name: Remove staging helpers
        run: rm tools/apply_v020_fix.py .github/workflows/apply-v020-fix.yml .github/workflows/apply-v020-fix-v2.yml
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v0.2.20"
          git push origin HEAD:fix/global-active-todo-v020

name: v0.2.28 audit fixes

on:
  push:
    branches:
      - work/v0.2.28-maintenance

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[v028-phase2-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.28-maintenance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply phase 2 cleanup
        run: python scripts/apply_v028_phase2.py
      - name: Compile
        run: python -m compileall -q src tests
      - name: Install package
        run: python -m pip install -e .
      - name: Run migration, inspection, install and cross-host regression
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.test_state_layout_v028 tests.test_config_migrations_v028 tests.test_inspection_state_v028 -v
          python -m unittest tests.test_stage_a tests.test_retrieval_gate tests.test_session_lineage -v
          python -m unittest tests.test_codex_install tests.test_hermes_provider tests.test_hermes_stdio_transport tests.test_host_events -v
          python -m unittest tests.test_cross_host_acceptance tests.test_maintenance_v2 tests.test_long_run_hygiene -v
      - name: Static state boundary checks
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -nE '(_index.{0,40}(processed|agents|host_ingest|retrieval_gate|compaction|vault\.lock)|index_path.{0,40}(processed|agents|host_ingest|retrieval_gate|compaction|vault\.lock))' -- src/memleaf ':!src/memleaf/state_layout.py' ':!src/memleaf/inspection.py'
          ! git grep -nE '(processed_index_path|agents_index_path|update_agents_index|agent_index_path)' -- src/memleaf
      - name: Commit generated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: finish v0.2.28 state boundary cleanup [v028-phase2-generated]'
          git push origin HEAD:work/v0.2.28-maintenance

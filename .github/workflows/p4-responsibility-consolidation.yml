name: P4 responsibility consolidation

on:
  push:
    branches:
      - experiment/p4-responsibility-consolidation-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p4-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile P4 assets
        run: |
          python -m py_compile \
            src/memleaf/maintenance_plan_protocol.py \
            src/memleaf/maintenance_plan_stage.py \
            tests/test_p4_maintenance_plan.py \
            tests/test_p4_maintenance_plan_stage.py
      - name: Validate P4 protocol and stage-two boundary
        run: |
          python -m unittest \
            tests.test_p4_maintenance_plan \
            tests.test_p4_maintenance_plan_stage -v

name: v0.2.28 no-SQLite finalizer

on:
  push:
    branches:
      - work/v0.2.28-release

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.28-release
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Import verified stress evidence and remove SQLite experiment files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/v0.2.28-maintenance
          mkdir -p benchmarks/results docs
          git show origin/work/v0.2.28-maintenance:benchmarks/results/v0.2.28-linux.json > benchmarks/results/v0.2.28-linux.json
          python scripts/finalize_v028_no_sqlite.py benchmarks/results/v0.2.28-linux.json
          rm -f .github/workflows/v028-sqlite.yml
          rm -f scripts/apply_v028_sqlite_index.py
          rm -f scripts/fix_v028_sqlite_index.py
          rm -f scripts/fix_v028_sqlite_internal_search.py
          rm -f scripts/optimize_v028_sqlite_candidates.py
          rm -f scripts/optimize_v028_sqlite_rebuild.py
          rm -f scripts/update_v028_benchmark_report.py
          if git grep -nEi 'sqlite|fts5' -- src scripts/benchmark_long_run.py; then
            echo 'unexpected SQLite/FTS product reference remains' >&2
            exit 1
          fi

      - name: Compile install and render performance report
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts/benchmark_long_run.py
          python -m pip install -e .
          python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          payload = json.loads(Path('benchmarks/results/v0.2.28-linux.json').read_text(encoding='utf-8'))
          render = runpy.run_path('scripts/benchmark_long_run.py')['_render_markdown']
          Path('docs/performance.md').write_text(render(payload), encoding='utf-8')
          PY

      - name: Validate evidence semantics and lifecycle coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('benchmarks/results/v0.2.28-linux.json').read_text(encoding='utf-8'))
          decision = payload['decision']
          assert payload['schema_version'] == 2
          assert [row['memory_count'] for row in payload['results']] == [1000, 10000, 50000]
          assert decision['workload_classification'] == 'stress_boundary'
          assert decision['normal_steady_state_assumed'] is False
          assert decision['architecture_change_required'] is False
          assert 'Raw benchmark timings/resource measurements are preserved' in payload['evidence_note']
          text = Path('docs/performance.md').read_text(encoding='utf-8')
          for needle in ('extreme stress boundary', 'Scope Map -> scope-constrained search -> read', 'Active-memory lifecycle health', 'Markdown-only'):
              assert needle in text, needle
          print(json.dumps(decision, ensure_ascii=False, sort_keys=True))
          PY
          python -m unittest tests.test_long_run_hygiene tests.test_state_layout_v028 tests.test_source_neutral_todos_v028 tests.test_global_todo_retrieval tests.test_stage_b3a_contract -v

      - name: Commit clean benchmarked candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/v028-finalize.yml scripts/finalize_v028_no_sqlite.py
          git add -A
          git diff --cached --check
          git commit -m 'chore: finalize v0.2.28 maintenance without SQLite'
          git push origin HEAD:work/v0.2.28-release

name: v0.2.28 no-SQLite finalizer

on:
  push:
    branches:
      - work/v0.2.28-release

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.28-release
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reframe benchmark and remove SQLite experiment files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_v028_no_sqlite.py
          rm -f .github/workflows/v028-sqlite.yml
          rm -f scripts/apply_v028_sqlite_index.py
          rm -f scripts/fix_v028_sqlite_index.py
          rm -f scripts/fix_v028_sqlite_internal_search.py
          rm -f scripts/optimize_v028_sqlite_candidates.py
          rm -f scripts/optimize_v028_sqlite_rebuild.py
          rm -f scripts/update_v028_benchmark_report.py
          if git grep -nEi 'sqlite|fts5' -- src scripts/benchmark_long_run.py; then
            echo 'unexpected SQLite/FTS product reference remains' >&2
            exit 1
          fi

      - name: Compile and install
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts/benchmark_long_run.py
          python -m pip install -e .

      - name: Full regression
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Non-SQLite 1k 10k 50k stress benchmark
        shell: bash
        run: |
          set -euo pipefail
          python scripts/benchmark_long_run.py --counts 1000 10000 50000 --json-out benchmarks/results/v0.2.28-linux.json --markdown-out docs/performance.md

      - name: Validate stress semantics and lifecycle coverage
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json; from pathlib import Path; p=json.loads(Path('benchmarks/results/v0.2.28-linux.json').read_text()); d=p['decision']; assert p['schema_version']==2; assert [r['memory_count'] for r in p['results']]==[1000,10000,50000]; assert d['workload_classification']=='stress_boundary'; assert d['normal_steady_state_assumed'] is False; assert d['architecture_change_required'] is False; t=Path('docs/performance.md').read_text(); assert 'extreme stress boundary' in t; assert 'Scope Map -> scope-constrained search -> read' in t; assert 'Active-memory lifecycle health' in t; assert 'Markdown-only' in t; print(json.dumps(d, ensure_ascii=False, sort_keys=True))"
          python -m unittest tests.test_long_run_hygiene tests.test_state_layout_v028 tests.test_source_neutral_todos_v028 tests.test_global_todo_retrieval tests.test_stage_b3a_contract -v

      - name: Commit clean benchmarked candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/v028-finalize.yml scripts/finalize_v028_no_sqlite.py
          git add -A
          git diff --cached --check
          git commit -m 'chore: finalize v0.2.28 maintenance without SQLite'
          git push origin HEAD:work/v0.2.28-release

name: Verify v0.2.18 full-suite hotfix

on:
  push:
    branches:
      - hotfix/v0.2.18-full-suite

permissions:
  contents: write

jobs:
  hotfix:
    if: "${{ github.event.head_commit.message == 'chore: verify v0.2.18 full-suite hotfix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.2.18-full-suite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final-stage dedupe corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/memleaf/processing.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one patch anchor, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          # Final CREATE conflict classification: native sources may use
          # conservative text overlap; memleaf active records require exact
          # summary-body equality and must exclude current-turn partial writes.
          start = text.index('def _automatic_create_conflicts(\n')
          end = text.index('\n\ndef _todo_state_recovery_candidate(\n', start)
          replacement = '''def _automatic_create_conflicts(\n    candidate: Mapping[str, Any],\n    summary: Mapping[str, Any],\n    related: Iterable[Mapping[str, Any]],\n    *,\n    ignore_memory_id: str | None = None,\n    current_event_keys: Iterable[str] = (),\n) -> bool:\n    """Return true only when a finalized CREATE is already covered."""\n\n    candidate_text = str(candidate.get("memory", "")).strip()\n    queries = _candidate_lookup_queries(candidate_text)\n    summary_body = normalize_term(str(summary.get("body", "")))\n    candidate_type = candidate.get("type")\n    ignored = ignore_memory_id.casefold() if isinstance(ignore_memory_id, str) and ignore_memory_id else None\n    current = {\n        value.casefold() for value in current_event_keys\n        if isinstance(value, str) and value\n    }\n\n    def is_current_turn(value: Mapping[str, Any]) -> bool:\n        sources = value.get("sources")\n        if not isinstance(sources, list):\n            return False\n        return any(\n            isinstance(source, Mapping)\n            and isinstance(source.get("event_key"), str)\n            and source["event_key"].casefold() in current\n            for source in sources\n        )\n\n    for raw in related:\n        if not isinstance(raw, Mapping):\n            continue\n        memory_id = raw.get("memory_id")\n        if isinstance(memory_id, str) and ignored is not None and memory_id.casefold() == ignored:\n            # A previous failed transaction may already contain this exact\n            # deterministic CREATE; writer replay must finish idempotently.\n            continue\n        related_body = normalize_term(str(raw.get("body", "")))\n        if raw.get("native") is True:\n            related_text = normalize_term(\n                f"{raw.get('title', '')}\\n{raw.get('body', '')}"\n            )\n            for query in queries:\n                normalized = normalize_term(query)\n                if len(normalized) >= 8 and related_text and (\n                    normalized in related_text\n                    or (len(related_text) >= 8 and related_text in normalized)\n                ):\n                    return True\n            continue\n        if is_current_turn(raw):\n            continue\n        if raw.get("type") != candidate_type:\n            continue\n        if summary_body and related_body == summary_body:\n            return True\n    return False\n'''
          text = text[:start] + replacement + text[end:]

          # Candidate text alone cannot prove NO_CHANGE before summarize;
          # legitimate updates may retain the old topic/body while changing
          # status, tags, scopes, or other canonical fields.
          start = text.index('    @staticmethod\n    def _exact_active_duplicate(\n')
          end = text.index('    def _target_relation(\n', start)
          text = text[:start] + text[end:]
          replace_once(
              '''            candidate_scopes = list(candidate["scopes"])\n            if candidate.get("worth") and self._exact_active_duplicate(\n                candidate, related, scoped_records\n            ):\n                # Exact content already loaded for this Scope is a deterministic\n                # NO_CHANGE. No additional search/Scope scan is performed.\n                continue\n            # An automatic candidate with no reliable project attribution is\n''',
              '''            candidate_scopes = list(candidate["scopes"])\n            # An automatic candidate with no reliable project attribution is\n''',
          )

          # General inferred UPDATEs require the candidate to name the target
          # title explicitly. Shared project words are insufficient.
          replace_once(
              '''            try:\n                target = Memory.from_mapping(item)\n            except (TypeError, ValueError):\n                continue\n            if not candidate_matches_query(target, candidate_text):\n                continue\n            seen_same_type.add(memory_id.casefold())\n''',
              '''            try:\n                target = Memory.from_mapping(item)\n            except (TypeError, ValueError):\n                continue\n            target_title = normalize_term(target.title)\n            candidate_normalized = normalize_term(candidate_text)\n            if (\n                len(target_title) < 4\n                or target_title not in candidate_normalized\n                or not candidate_matches_query(target, candidate_text)\n            ):\n                continue\n            seen_same_type.add(memory_id.casefold())\n''',
          )

          # Never collapse an UPDATE solely because its body matches: status
          # and metadata transitions still require the normal writer/history path.
          replace_once(
              '''                target = self.service.read(gate_update_target, include_history=False)\n                if (\n                    target is not None\n                    and normalize_term(str(summary.get("body", ""))) == normalize_term(target.body)\n                ):\n                    # The current evidence does not change the canonical body.\n                    # Automatic processing must not create a history version\n                    # merely to append a repeated observation/source.\n                    continue\n                summary = self._merge_additive_project_plan_update(candidate, summary, target)\n''',
              '''                target = self.service.read(gate_update_target, include_history=False)\n                summary = self._merge_additive_project_plan_update(candidate, summary, target)\n''',
          )

          # Apply duplicate CREATE guard only after the final summary has not
          # selected an update target. Exact memleaf duplicates become a clean
          # NO_CHANGE; ambiguous/nonexact objects are allowed to remain separate.
          replace_once(
              '''            if gate_update_target is None and _automatic_create_conflicts(\n                candidate,\n                summary,\n                candidate_related,\n                ignore_memory_id=pending_request["memory_id"],\n            ):\n                self._defer_candidate(\n                    turn_ref,\n                    candidate,\n                    "possible_duplicate_target",\n                    scopes=summary["scopes"],\n                    scope_source=summary.get("scope_source"),\n                )\n                continue\n''',
              '''            summary_update_target = summary.get("update_memory_id")\n            final_is_create = not (\n                isinstance(summary_update_target, str) and summary_update_target\n            )\n            if final_is_create and _automatic_create_conflicts(\n                candidate,\n                summary,\n                candidate_related,\n                ignore_memory_id=pending_request["memory_id"],\n                current_event_keys=turn.event_keys,\n            ):\n                continue\n''',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Run regression gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python -m unittest tests.test_stage_b2a tests.test_stage_b2b tests.test_stage_b3d_scope_maintenance tests.test_cross_turn_dedupe_regressions tests.test_maintenance_v2 -v
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m compileall -q src tests examples
          git diff --check
      - name: Commit verified hotfix
        shell: bash
        run: |
          git rm -f .github/workflows/hotfix-v0.2.18-full-suite.yml
          git config user.name 'miffyblueboo'
          git config user.email '321381257+miffyblueboo@users.noreply.github.com'
          git add src/memleaf/processing.py
          git commit -m 'fix: preserve update and retry semantics under dedupe'
          git push origin HEAD:hotfix/v0.2.18-full-suite

name: Verify v0.2.18 full-suite hotfix

on:
  push:
    branches:
      - hotfix/v0.2.18-full-suite

permissions:
  contents: write

jobs:
  hotfix:
    if: "${{ github.event.head_commit.message == 'chore: verify v0.2.18 full-suite hotfix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.2.18-full-suite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow dedupe corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/memleaf/processing.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one patch anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '''        for query in queries:\n            normalized = normalize_term(query)\n            if len(normalized) >= 8 and (\n                normalized in related_normalized\n                or (len(related_normalized) >= 8 and related_normalized in normalized)\n            ):\n                return True\n        if raw.get("native") is True or raw.get("type") != candidate_type:\n            continue\n''',
              '''        if raw.get("native") is True:\n            # Native sources have no memleaf type metadata, so exact/subspan\n            # text overlap is the only safe final CREATE guard for them.\n            for query in queries:\n                normalized = normalize_term(query)\n                if len(normalized) >= 8 and (\n                    normalized in related_normalized\n                    or (len(related_normalized) >= 8 and related_normalized in normalized)\n                ):\n                    return True\n            continue\n        if raw.get("type") != candidate_type:\n            continue\n''',
          )

          start = text.index('    @staticmethod\n    def _exact_active_duplicate(\n')
          end = text.index('    def _target_relation(\n', start)
          replacement = '''    @staticmethod\n    def _exact_active_duplicate(\n        candidate: Mapping[str, Any],\n        related: Iterable[Mapping[str, Any]],\n        scoped_records: Optional[Iterable[Any]] = None,\n        *,\n        current_event_keys: Iterable[str] = (),\n    ) -> bool:\n        """Return true only for an exact pre-existing active/native duplicate.\n\n        Current-turn partial writes are deliberately excluded. If a transaction\n        persisted one deterministic memory before failing, replay must continue\n        so remaining candidates and writer recovery can finish idempotently.\n        """\n\n        memory = candidate.get("memory")\n        if not isinstance(memory, str) or not memory.strip():\n            return False\n        normalized = normalize_term(memory)\n        if not normalized:\n            return False\n        current = {\n            value.casefold() for value in current_event_keys\n            if isinstance(value, str) and value\n        }\n\n        def is_current_turn(value: Mapping[str, Any]) -> bool:\n            sources = value.get("sources")\n            if not isinstance(sources, list):\n                return False\n            return any(\n                isinstance(source, Mapping)\n                and isinstance(source.get("event_key"), str)\n                and source["event_key"].casefold() in current\n                for source in sources\n            )\n\n        for item in related:\n            if not isinstance(item, Mapping) or is_current_turn(item):\n                continue\n            body = item.get("body")\n            if isinstance(body, str) and normalize_term(body) == normalized:\n                return True\n        for record in scoped_records or ():\n            target = getattr(record, "memory", None)\n            body = getattr(target, "body", None)\n            if not isinstance(body, str) or normalize_term(body) != normalized:\n                continue\n            try:\n                target_value = target.to_dict()\n            except (AttributeError, TypeError, ValueError):\n                target_value = {}\n            if isinstance(target_value, Mapping) and is_current_turn(target_value):\n                continue\n            return True\n        return False\n\n'''
          text = text[:start] + replacement + text[end:]

          replace_once(
              '''            candidate_scopes = list(candidate["scopes"])\n            if candidate.get("worth") and self._exact_active_duplicate(\n                candidate, related, scoped_records\n            ):\n                # Exact content already loaded for this Scope is a deterministic\n                # NO_CHANGE. No additional search/Scope scan is performed.\n                continue\n            # An automatic candidate with no reliable project attribution is\n''',
              '''            candidate_scopes = list(candidate["scopes"])\n            has_target = any(\n                isinstance(candidate.get(field), str) and candidate.get(field)\n                for field in ("duplicate_memory_id", "update_memory_id")\n            )\n            if candidate.get("worth") and not has_target and self._exact_active_duplicate(\n                candidate,\n                related,\n                scoped_records,\n                current_event_keys=turn.event_keys,\n            ):\n                # Only a target-free exact duplicate from a previous turn is\n                # deterministic NO_CHANGE. Explicit targets still pass through\n                # validation, and current-turn partial writes remain replayable.\n                continue\n            # An automatic candidate with no reliable project attribution is\n''',
          )
          replace_once(
              '''            has_target = any(\n                isinstance(candidate.get(field), str) and candidate.get(field)\n                for field in ("duplicate_memory_id", "update_memory_id")\n            )\n            if (\n                scope_directory is not None\n''',
              '''            if (\n                scope_directory is not None\n''',
          )

          replace_once(
              '''            try:\n                target = Memory.from_mapping(item)\n            except (TypeError, ValueError):\n                continue\n            if not candidate_matches_query(target, candidate_text):\n                continue\n            seen_same_type.add(memory_id.casefold())\n''',
              '''            try:\n                target = Memory.from_mapping(item)\n            except (TypeError, ValueError):\n                continue\n            # General target recovery is intentionally stricter than public\n            # candidate search. The candidate must explicitly name the target\n            # title; shared project words alone cannot turn an independent\n            # future-use object or a scope migration into an UPDATE.\n            target_title = normalize_term(target.title)\n            candidate_normalized = normalize_term(candidate_text)\n            if (\n                len(target_title) < 4\n                or target_title not in candidate_normalized\n                or not candidate_matches_query(target, candidate_text)\n            ):\n                continue\n            seen_same_type.add(memory_id.casefold())\n''',
          )

          replace_once(
              '''                target = self.service.read(gate_update_target, include_history=False)\n                if (\n                    target is not None\n                    and normalize_term(str(summary.get("body", ""))) == normalize_term(target.body)\n                ):\n                    # The current evidence does not change the canonical body.\n                    # Automatic processing must not create a history version\n                    # merely to append a repeated observation/source.\n                    continue\n                summary = self._merge_additive_project_plan_update(candidate, summary, target)\n''',
              '''                target = self.service.read(gate_update_target, include_history=False)\n                # Body equality alone is not NO_CHANGE: status, completion,\n                # tags, scopes or other canonical fields may still change.\n                # Exact repeated observations are filtered before summarize.\n                summary = self._merge_additive_project_plan_update(candidate, summary, target)\n''',
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Run regression gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python -m unittest tests.test_stage_b2a tests.test_stage_b2b tests.test_stage_b3d_scope_maintenance tests.test_cross_turn_dedupe_regressions tests.test_maintenance_v2 -v
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m compileall -q src tests examples
          git diff --check
      - name: Commit verified hotfix
        shell: bash
        run: |
          git rm -f .github/workflows/hotfix-v0.2.18-full-suite.yml
          git config user.name 'miffyblueboo'
          git config user.email '321381257+miffyblueboo@users.noreply.github.com'
          git add src/memleaf/processing.py
          git commit -m 'fix: preserve update and retry semantics under dedupe'
          git push origin HEAD:hotfix/v0.2.18-full-suite

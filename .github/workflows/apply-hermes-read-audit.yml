name: Verify Hermes controlled read audit

on:
  push:
    branches:
      - fix/hermes-native-dedup-cross-turn

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: verify Hermes controlled read audit' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hermes-native-dedup-cross-turn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply conservative Soft Gate audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one patch anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/memleaf/hermes_provider/__init__.py',
              '''        self._last_retrieval_observation = "unknown"\n''',
              '''        self._last_retrieval_observation = "unknown"\n        self._last_retrieval_audit = "SEARCH_UNKNOWN"\n''',
          )
          replace_once(
              'src/memleaf/hermes_provider/__init__.py',
              '''        vault_root: Optional[Path] = None,\n        seen_call_keys: Any = None,\n    ) -> str:\n''',
              '''        vault_root: Optional[Path] = None,\n        seen_call_keys: Any = None,\n        audit_state: Optional[dict[str, Any]] = None,\n    ) -> str:\n''',
          )
          replace_once(
              'src/memleaf/hermes_provider/__init__.py',
              '''        read_results_used: set[int] = set()\n        read_sequence = 0\n        read_ordinal = 0\n''',
              '''        read_results_used: set[int] = set()\n        read_sequence = 0\n        controlled_reads = 0\n        read_ordinal = 0\n''',
          )
          replace_once(
              'src/memleaf/hermes_provider/__init__.py',
              '''            if not _record_tool_observation(seen_call_keys, observation_key):\n                continue\n            read_sequence += 1\n            logger.info(\n''',
              '''            if not _record_tool_observation(seen_call_keys, observation_key):\n                continue\n            read_sequence += 1\n            if result_status == "ok" and retrieval_match:\n                controlled_reads += 1\n            logger.info(\n''',
          )
          replace_once(
              'src/memleaf/hermes_provider/__init__.py',
              '''        if not statuses:\n            return "unknown"\n        if "found" in statuses:\n            return "found"\n        if "no_match" in statuses:\n            return "no_match"\n        return "error"\n''',
              '''        if not statuses:\n            search_status = "unknown"\n            audit_status = "SEARCH_UNKNOWN"\n        elif "found" in statuses:\n            search_status = "found"\n            # Hermes exposes no public pre-final hook and no reliable signal\n            # that proves whether an answer used historical memory when no\n            # controlled read occurred. Do not fabricate FOUND_NOT_USED or\n            # FOUND_REQUIRED_READ_MISSING; record the uncertainty explicitly.\n            audit_status = "FOUND_READ" if controlled_reads else "FOUND_NO_READ_UNDETERMINED"\n        elif "no_match" in statuses:\n            search_status = "no_match"\n            audit_status = "NO_MATCH"\n        else:\n            search_status = "error"\n            audit_status = "ERROR"\n        if isinstance(audit_state, dict):\n            audit_state.clear()\n            audit_state.update(\n                {\n                    "status": audit_status,\n                    "search_status": search_status,\n                    "controlled_reads": controlled_reads,\n                }\n            )\n        logger.info(\n            "memleaf retrieval-audit source=hermes session=%s turn=%s status=%s search=%s controlled_reads=%d",\n            _safe_component(session_id, "none") if session_id else "none",\n            _safe_component(turn_id, "none") if turn_id else "none",\n            audit_status,\n            search_status,\n            controlled_reads,\n        )\n        return search_status\n''',
          )
          replace_once(
              'src/memleaf/hermes_provider/__init__.py',
              '''                if self._gate_enabled:\n                    observation = self._observe_search_messages(\n                        messages,\n                        retrieval_id,\n                        session_id=effective_session,\n                        turn_id=turn_id,\n                        vault_root=_resolve_vault(self._config()),\n                        seen_call_keys=self._observed_tool_call_keys,\n                    )\n''',
              '''                if self._gate_enabled:\n                    audit_state: dict[str, Any] = {}\n                    observation = self._observe_search_messages(\n                        messages,\n                        retrieval_id,\n                        session_id=effective_session,\n                        turn_id=turn_id,\n                        vault_root=_resolve_vault(self._config()),\n                        seen_call_keys=self._observed_tool_call_keys,\n                        audit_state=audit_state,\n                    )\n''',
          )
          replace_once(
              'src/memleaf/hermes_provider/__init__.py',
              '''                    self._last_retrieval_observation = observation\n''',
              '''                    self._last_retrieval_observation = observation\n                    self._last_retrieval_audit = str(audit_state.get("status") or "SEARCH_UNKNOWN")\n''',
          )

          tests = Path('tests/test_hermes_provider.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '''    def test_search_status_rejects_malformed_v2_envelopes(self) -> None:\n'''
          addition = '''    def test_soft_audit_distinguishes_controlled_read_from_unresolved_found(self) -> None:\n        token = "rtv-audit-current"\n        search_call = {\n            "id": "audit-search",\n            "function": {\n                "name": "mcp__memleaf__search",\n                "arguments": json.dumps({"query": "project", "retrieval_id": token}),\n            },\n        }\n        search_result = {\n            "role": "tool",\n            "tool_call_id": "audit-search",\n            "content": json.dumps(\n                {"status": "found", "results": [{"memory_id": "AUDIT_MEMORY", "title": "Audit title"}]}\n            ),\n        }\n        no_read_messages = [{"role": "assistant", "tool_calls": [search_call]}, search_result]\n        unresolved = {}\n        with patch.object(provider_module.logger, "info") as info:\n            status = provider_module.MemleafMemoryProvider._observe_search_messages(\n                no_read_messages, token, audit_state=unresolved\n            )\n        self.assertEqual(status, "found")\n        self.assertEqual(unresolved["status"], "FOUND_NO_READ_UNDETERMINED")\n        self.assertEqual(unresolved["controlled_reads"], 0)\n\n        read_call = {\n            "id": "audit-read",\n            "function": {\n                "name": "mcp__memleaf__read",\n                "arguments": json.dumps({"memory_id": "AUDIT_MEMORY", "retrieval_id": token}),\n            },\n        }\n        with_read = [\n            {"role": "assistant", "tool_calls": [search_call, read_call]},\n            search_result,\n            {\n                "role": "tool",\n                "tool_call_id": "audit-read",\n                "content": json.dumps({"memory_id": "AUDIT_MEMORY", "body": "AUDIT_BODY_SECRET"}),\n            },\n        ]\n        read_audit = {}\n        with patch.object(provider_module.logger, "info") as info:\n            status = provider_module.MemleafMemoryProvider._observe_search_messages(\n                with_read, token, audit_state=read_audit\n            )\n            output = "\\n".join(call.args[0] % call.args[1:] for call in info.call_args_list)\n        self.assertEqual(status, "found")\n        self.assertEqual(read_audit["status"], "FOUND_READ")\n        self.assertEqual(read_audit["controlled_reads"], 1)\n        self.assertIn("status=FOUND_READ", output)\n        for secret in (token, "AUDIT_MEMORY", "AUDIT_BODY_SECRET", "Audit title"):\n            self.assertNotIn(secret, output)\n\n    def test_sync_turn_keeps_soft_audit_as_diagnostic_state(self) -> None:\n        provider = self.provider(responses=[{"stored": True}, {"stored": True}])\n        provider._auto_process = False\n        provider._gate_enabled = True\n        provider._session_id = "audit-session"\n        provider._active_retrieval_ids["audit-session"] = "rtv-audit-sync"\n        messages = [\n            {\n                "role": "assistant",\n                "tool_calls": [\n                    {\n                        "id": "sync-search",\n                        "function": {\n                            "name": "mcp__memleaf__search",\n                            "arguments": json.dumps(\n                                {"query": "current", "retrieval_id": "rtv-audit-sync"}\n                            ),\n                        },\n                    }\n                ],\n            },\n            {\n                "role": "tool",\n                "tool_call_id": "sync-search",\n                "content": json.dumps(\n                    {"status": "found", "results": [{"memory_id": "m", "title": "M"}]}\n                ),\n            },\n        ]\n        provider.sync_turn("visible", "answer", session_id="audit-session", messages=messages)\n        self.assertEqual(provider._last_retrieval_observation, "found")\n        self.assertEqual(provider._last_retrieval_audit, "FOUND_NO_READ_UNDETERMINED")\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one test insertion anchor, found {text.count(anchor)}')
          tests.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY
      - name: Run Hermes provider and retrieval regressions
        run: |
          python -m pip install .
          python -m unittest tests.test_hermes_provider -v
          python -m unittest tests.test_retrieval_v2 tests.test_v2_mcp_flow -v
          python -m compileall -q src tests
          git diff --check
      - name: Commit verified Soft Gate audit
        shell: bash
        run: |
          git rm .github/workflows/apply-hermes-read-audit.yml
          git config user.name 'miffyblueboo'
          git config user.email '321381257+miffyblueboo@users.noreply.github.com'
          git add src/memleaf/hermes_provider/__init__.py tests/test_hermes_provider.py
          git commit -m 'fix: distinguish Hermes controlled read audit states'
          git push origin HEAD:fix/hermes-native-dedup-cross-turn

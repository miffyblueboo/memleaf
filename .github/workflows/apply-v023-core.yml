name: Apply v0.2.23 core repair

on:
  push:
    branches:
      - fix/v0.2.23-scope-mixed-evidence

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair staging anchors
        run: python tools/fix_v023_stager.py
      - name: Apply repair
        run: python tools/apply_v023_core.py
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests examples
      - name: Run focused regressions
        run: python -m unittest -v tests.test_v023_scope_correction tests.test_extraction_quality_regressions tests.test_update_target_recovery tests.test_global_todo_acceptance tests.test_hermes_provider
      - name: Run full suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check diff
        run: git diff --check
      - name: Commit validated repair
        run: |
          rm -f .github/workflows/apply-v023-core.yml tools/apply_v023_core.py tools/fix_v023_stager.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: add strict scope correction and bounded evidence"
          git push origin HEAD:fix/v0.2.23-scope-mixed-evidence

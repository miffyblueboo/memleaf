name: Temporary B3 planner integration

on:
  push:
    branches:
      - automation/b3-planner-integration-20260910

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out B3 candidate
        uses: actions/checkout@v4
        with:
          ref: experiment/b3-single-pass-planner-20260910
          fetch-depth: 0
          persist-credentials: true
      - name: Check out patcher
        uses: actions/checkout@v4
        with:
          ref: automation/b3-planner-integration-20260910
          path: .patcher
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify expected B3 head
        run: test "$(git rev-parse HEAD)" = "8d2610e6fd0dd878e9b83b0b4700903a74f9a32e"
      - name: Apply B3 planner integration
        run: python .patcher/scripts/patch_b3_planner_integration.py
      - name: Install and validate B3 integration
        run: |
          python -m pip install -e .
          python -m py_compile \
            src/memleaf/single_pass_plan.py \
            src/memleaf/single_pass_memory_planner.py \
            src/memleaf/planning_context.py \
            tests/test_b3_single_pass_plan.py \
            tests/test_b3_planning_context.py \
            tests/test_b3_single_pass_memory_planner.py
          python -m unittest \
            tests.test_b3_single_pass_plan \
            tests.test_b3_planning_context \
            tests.test_b3_single_pass_memory_planner -v
          python -m unittest tests.test_processing_contract_v026.FrozenPlanTests -v
      - name: Commit and push B3 source integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/memleaf/single_pass_plan.py \
            src/memleaf/single_pass_memory_planner.py \
            src/memleaf/planning_context.py \
            tests/test_b3_single_pass_plan.py \
            tests/test_b3_single_pass_memory_planner.py
          git diff --cached --quiet && { echo "expected B3 integration changes missing"; exit 1; }
          git commit -m "experiment: integrate B3 automatic single-pass planner"
          git push origin HEAD:experiment/b3-single-pass-planner-20260910

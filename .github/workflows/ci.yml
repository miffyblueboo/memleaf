name: CI

on:
  push:
  pull_request:

# Distinguish PR and push runs; cancel obsolete runs of the same branch only.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Run public deterministic contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests_public -p 'test_*.py'
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
      - name: Bind distributions to source and public tests
        run: python scripts/verify_distribution.py --prepare --source . --dist dist --commit "${{ github.sha }}"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/
          if-no-files-found: error

  platform:
    name: Installed distributions (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Preserve repository bytes on every OS
        run: git config --global core.autocrlf false
      - name: Check out the same source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install sdist build tools (not application dependencies)
        run: python -m pip install --upgrade setuptools wheel
      - name: Download the exact distributions from this run
        uses: actions/download-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/
      - name: Test fresh wheel and native sdist installations
        run: python scripts/verify_distribution.py --verify --source . --dist dist --commit "${{ github.sha }}" --output platform-verification
      - name: Retain platform evidence including failures and skips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.os }}-${{ matrix.python }}
          path: platform-verification/
          if-no-files-found: warn

  release:
    needs: [build, platform]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@v4

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/

      - name: Prepare release metadata from pyproject and CHANGELOG
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          SUBJECT="$(git log -1 --pretty=%s)"
          test "$SUBJECT" = "release: v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          python - "$VERSION" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          prefix = f"## {version}"
          start = next((i for i, line in enumerate(lines) if line.startswith(prefix)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip() + "\n"
          Path("/tmp/memleaf-release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          RELEASE_SHA="$GITHUB_SHA"
          test -f "dist/memleaf-${VERSION}-py3-none-any.whl"
          test -f "dist/memleaf-${VERSION}.tar.gz"
          (
            cd dist
            sha256sum "memleaf-${VERSION}-py3-none-any.whl" "memleaf-${VERSION}.tar.gz" > SHA256SUMS
          )

          verify_existing_release() {
            local release_target
            local target_sha
            release_target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
            test "$target_sha" = "$RELEASE_SHA" || {
              echo "Release ${TAG} target ${release_target} resolves to ${target_sha}, expected ${RELEASE_SHA}" >&2
              return 1
            }
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "dist/memleaf-${VERSION}-py3-none-any.whl" \
              "dist/memleaf-${VERSION}.tar.gz" \
              dist/SHA256SUMS
          }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            verify_existing_release
          elif gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "memleaf ${VERSION}" \
              --notes-file /tmp/memleaf-release-notes.md \
              --latest \
              "dist/memleaf-${VERSION}-py3-none-any.whl" \
              "dist/memleaf-${VERSION}.tar.gz" \
              dist/SHA256SUMS; then
            :
          else
            # Another release attempt may have won the create race. Only
            # continue after resolving and validating that release's target.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            verify_existing_release
          fi

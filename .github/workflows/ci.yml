name: CI

on:
  push:
  pull_request:

# Keep one current run per event type and head branch. The workflow is
# intentionally triggered by both push and pull_request, but rapid development
# should not leave dozens of obsolete matrix runs ahead of the current head.
# Including event_name avoids a push run cancelling the PR check for the same
# commit while still cancelling superseded push/PR runs independently.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build "setuptools>=77"
      - name: Check source syntax
        run: python -m compileall -q src
      - name: Build wheel and source distribution once
        run: python -m build --wheel --sdist
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: memleaf-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  verify-artifacts:
    name: Installed artifacts (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Set up native Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download the same candidate distributions
        uses: actions/download-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/
      - name: Install and import wheel and source distribution separately
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import venv

          dist = Path("dist")
          artifacts = sorted(dist.glob("*.whl")) + sorted(dist.glob("*.tar.gz"))
          if len(artifacts) != 2:
              raise SystemExit(f"expected exactly one wheel and one sdist, got {artifacts}")
          evidence = Path("artifact-verification")
          evidence.mkdir()

          for artifact in artifacts:
              with tempfile.TemporaryDirectory(prefix="memleaf-install-") as temp:
                  environment = Path(temp) / "venv"
                  venv.EnvBuilder(with_pip=True).create(environment)
                  python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
                  if artifact.suffixes[-2:] == [".tar", ".gz"]:
                      subprocess.run(
                          [str(python), "-m", "pip", "install", "--upgrade", "setuptools>=77", "wheel"],
                          check=True,
                      )
                  subprocess.run(
                      [
                          str(python), "-m", "pip", "install", "--no-deps",
                          "--no-build-isolation", str(artifact.resolve()),
                      ],
                      check=True,
                  )
                  result = subprocess.run(
                      [str(python), "-c", "import memleaf; print(memleaf.__version__)"],
                      check=True, capture_output=True, text=True,
                  )
                  (evidence / f"{artifact.name}.json").write_text(
                      json.dumps({"artifact": artifact.name, "version": result.stdout.strip()}),
                      encoding="utf-8",
                  )
      - name: Upload installation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-artifacts-${{ matrix.os }}-py${{ matrix.python }}
          path: artifact-verification/
          if-no-files-found: warn

  release:
    needs: [build, verify-artifacts]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@v4

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/

      - name: Prepare release metadata from pyproject and CHANGELOG
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          SUBJECT="$(git log -1 --pretty=%s)"
          test "$SUBJECT" = "release: v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          python - "$VERSION" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          prefix = f"## {version}"
          start = next((i for i, line in enumerate(lines) if line.startswith(prefix)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip() + "\n"
          Path("/tmp/memleaf-release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          RELEASE_SHA="$GITHUB_SHA"
          test -f "dist/memleaf-${VERSION}-py3-none-any.whl"
          test -f "dist/memleaf-${VERSION}.tar.gz"
          (
            cd dist
            sha256sum "memleaf-${VERSION}-py3-none-any.whl" "memleaf-${VERSION}.tar.gz" > SHA256SUMS
          )

          verify_existing_release() {
            python - "$TAG" "$RELEASE_SHA" "$VERSION" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          tag, expected_sha, version = sys.argv[1:]
          repository = os.environ["GITHUB_REPOSITORY"]
          expected_paths = {
              f"memleaf-{version}-py3-none-any.whl": Path("dist") / f"memleaf-{version}-py3-none-any.whl",
              f"memleaf-{version}.tar.gz": Path("dist") / f"memleaf-{version}.tar.gz",
              "SHA256SUMS": Path("dist") / "SHA256SUMS",
          }

          def gh_json(endpoint):
              return json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))

          commit = gh_json(f"repos/{repository}/commits/{tag}")
          if commit.get("sha") != expected_sha:
              raise SystemExit("release_target_changed")
          release = gh_json(f"repos/{repository}/releases/tags/{tag}")
          assets = {item.get("name"): item for item in release.get("assets", [])}

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          for name, path in expected_paths.items():
              if not path.is_file() or name not in assets:
                  raise SystemExit(f"release_asset_missing:{name}")
              asset = assets[name]
              if asset.get("state") != "uploaded" or not isinstance(asset.get("id"), int):
                  raise SystemExit(f"release_asset_incomplete:{name}")
              remote = subprocess.check_output([
                  "gh", "api", "-H", "Accept: application/octet-stream",
                  f"repos/{repository}/releases/assets/{asset['id']}",
              ])
              if digest(path.read_bytes()) != digest(remote):
                  raise SystemExit(f"release_asset_conflict:{name}")
          PY
          }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            verify_existing_release
          elif gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "memleaf ${VERSION}" \
              --notes-file /tmp/memleaf-release-notes.md \
              --latest \
              "dist/memleaf-${VERSION}-py3-none-any.whl" \
              "dist/memleaf-${VERSION}.tar.gz" \
              dist/SHA256SUMS; then
            verify_existing_release
          else
            # Another release attempt may have won the create race.  Only
            # continue after resolving and validating that release's target.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            verify_existing_release
          fi

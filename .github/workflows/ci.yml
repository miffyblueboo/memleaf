name: Windows bounded diagnostic
on: push
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instrument native file observations
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/memleaf/incremental_native.py')
          text=p.read_text(encoding='utf-8')
          needle='    if (any(signature(s) != signature(before)'
          text=text.replace(needle, '    if any(signature(s) != signature(before) for s in (opened, finished, after)):\n        print("STAT_OBSERVATIONS", [signature(s) for s in (before, opened, finished, after)], flush=True)\n'+needle)
          p.write_text(text,encoding='utf-8')
      - name: Run focused native tests
        env:
          PYTHONPATH: src;tests_public
          PYTHONUTF8: '1'
        shell: python
        run: |
          import subprocess,sys
          from pathlib import Path
          out=Path('diagnostic');out.mkdir()
          cmd=[sys.executable,'-u','-m','unittest','test_incremental_native','test_query_scan_reuse.QueryScanReuseTests.test_format_only_change_is_reparsed_with_existing_equivalence','-v']
          with (out/'focused.log').open('w',encoding='utf-8') as log:
              r=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=240)
          print((out/'focused.log').read_text(encoding='utf-8',errors='replace')[-22000:])
          sys.exit(r.returncode)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bounded-diagnostic
          path: diagnostic/

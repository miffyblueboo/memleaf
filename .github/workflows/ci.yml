name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
      - name: Compile source and tests
        run: python -m compileall -q src tests examples
      - name: Run unittest suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  windows-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
      - name: Compile source and tests
        run: python -m compileall -q src tests examples
      - name: Run Windows installation tests
        run: |
          python -m unittest discover -s tests -p 'test_pypi_install.py' -v
          python -m unittest discover -s tests -p 'test_upgrade_preserves_vault.py' -v
          python -m unittest discover -s tests -p 'test_credential_safety.py' -v
          python -m unittest discover -s tests -p 'test_hermes_stdio_transport.py' -v
          python -m unittest discover -s tests -p 'test_stage_c3_packaging.py' -v
          python -m unittest discover -s tests -p 'test_codex_install.py' -v
      - name: Smoke-test installed commands and Vault
        shell: pwsh
        run: |
          memleaf --version
          memleaf-mcp --version
          python -c "from pathlib import Path; import tempfile; from memleaf import Memleaf; d=tempfile.TemporaryDirectory(); m=Memleaf.initialize(Path(d.name)/'vault'); assert m.stats()['knowledge'] == 0; d.cleanup()"
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  macos-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Compile source and tests
        run: python -m compileall -q src tests examples
      - name: Run Codex adapter and host lifecycle tests
        run: |
          python -m unittest tests.test_codex_install -v
          python -m unittest tests.test_host_events tests.test_v2_host_flow -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
      - name: Verify wheel installation and entry points
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import memleaf; print(memleaf.__version__)"
          memleaf --help
          memleaf --version
          memleaf-mcp --version
      - name: Verify tests from the source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/memleaf-sdist"
          tar -xzf dist/memleaf-*.tar.gz -C "$RUNNER_TEMP/memleaf-sdist"
          cd "$RUNNER_TEMP"/memleaf-sdist/memleaf-*
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/

  release:
    needs: [test, windows-test, macos-test, build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@v4

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/

      - name: Prepare release metadata from pyproject and CHANGELOG
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          SUBJECT="$(git log -1 --pretty=%s)"
          test "$SUBJECT" = "release: v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          python - "$VERSION" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          prefix = f"## {version}"
          start = next((i for i, line in enumerate(lines) if line.startswith(prefix)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip() + "\n"
          Path("/tmp/memleaf-release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          test -f "dist/memleaf-${VERSION}-py3-none-any.whl"
          test -f "dist/memleaf-${VERSION}.tar.gz"
          (
            cd dist
            sha256sum "memleaf-${VERSION}-py3-none-any.whl" "memleaf-${VERSION}.tar.gz" > SHA256SUMS
          )
          gh release create "v${VERSION}"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "memleaf ${VERSION}"             --notes-file /tmp/memleaf-release-notes.md             --latest             "dist/memleaf-${VERSION}-py3-none-any.whl"             "dist/memleaf-${VERSION}.tar.gz"             dist/SHA256SUMS

name: CI

on:
  push:
  pull_request:

# Keep one current run per event type and head branch. The workflow is
# intentionally triggered by both push and pull_request, but rapid development
# should not leave dozens of obsolete matrix runs ahead of the current head.
# Including event_name avoids a push run cancelling the PR check for the same
# commit while still cancelling superseded push/PR runs independently.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
      - name: Verify wheel installation and entry points
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import memleaf; print(memleaf.__version__)"
          memleaf --help
          memleaf --version
          memleaf-mcp --version
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/

  release:
    needs: [build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@v4

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/

      - name: Prepare release metadata from pyproject and CHANGELOG
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          SUBJECT="$(git log -1 --pretty=%s)"
          test "$SUBJECT" = "release: v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          python - "$VERSION" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          prefix = f"## {version}"
          start = next((i for i, line in enumerate(lines) if line.startswith(prefix)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip() + "\n"
          Path("/tmp/memleaf-release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          RELEASE_SHA="$GITHUB_SHA"
          test -f "dist/memleaf-${VERSION}-py3-none-any.whl"
          test -f "dist/memleaf-${VERSION}.tar.gz"
          (
            cd dist
            sha256sum "memleaf-${VERSION}-py3-none-any.whl" "memleaf-${VERSION}.tar.gz" > SHA256SUMS
          )

          verify_existing_release() {
            local release_target
            local target_sha
            release_target="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
            test "$target_sha" = "$RELEASE_SHA" || {
              echo "Release ${TAG} target ${release_target} resolves to ${target_sha}, expected ${RELEASE_SHA}" >&2
              return 1
            }
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "dist/memleaf-${VERSION}-py3-none-any.whl" \
              "dist/memleaf-${VERSION}.tar.gz" \
              dist/SHA256SUMS
          }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            verify_existing_release
          elif gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "memleaf ${VERSION}" \
              --notes-file /tmp/memleaf-release-notes.md \
              --latest \
              "dist/memleaf-${VERSION}-py3-none-any.whl" \
              "dist/memleaf-${VERSION}.tar.gz" \
              dist/SHA256SUMS; then
            :
          else
            # Another release attempt may have won the create race.  Only
            # continue after resolving and validating that release's target.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            verify_existing_release
          fi

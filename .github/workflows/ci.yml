name: Windows bounded diagnostic
on: push
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only timezone data
        run: python -m pip install tzdata
      - name: Bounded full source test with stack dumps
        shell: python
        env:
          PYTHONPATH: src
          PYTHONUTF8: '1'
        run: |
          import os, subprocess, sys
          from pathlib import Path
          out=Path('diagnostic');out.mkdir()
          code="import faulthandler,runpy; faulthandler.dump_traceback_later(45,repeat=True); runpy.run_path('tests_public/run_contracts.py',run_name='__main__')"
          command=[sys.executable,'-u','-c',code,'--tests','tests_public','--source-root','src','--report',str(out/'report.json')]
          with (out/'tests.log').open('w',encoding='utf-8') as log:
              try:
                  result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=240)
                  exit_code=result.returncode
              except subprocess.TimeoutExpired:
                  exit_code=124
          print((out/'tests.log').read_text(encoding='utf-8',errors='replace')[-24000:])
          sys.exit(exit_code)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-bounded-diagnostic
          path: diagnostic/

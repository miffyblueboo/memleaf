name: CI

on:
  push:
  pull_request:

# Keep one current run per event type and head branch. The workflow is
# intentionally triggered by both push and pull_request, but rapid development
# should not leave dozens of obsolete matrix runs ahead of the current head.
# Including event_name avoids a push run cancelling the PR check for the same
# commit while still cancelling superseded push/PR runs independently.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build "setuptools>=77"
      - name: Check source syntax
        run: python -m compileall -q src
      - name: Build wheel and source distribution once
        run: python -m build --wheel --sdist
      - name: Check release payload boundaries
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          artifacts = sorted(Path("dist").glob("*.whl")) + sorted(Path("dist").glob("*.tar.gz"))
          if len(artifacts) != 2:
              raise SystemExit("expected one wheel and one source distribution")
          private_dirs = {"tests", "tests_public", "__pycache__", ".git", ".codegraph", ".memleaf", ".hermes", ".venv"}
          development_files = {"acceptance.py", "query_benchmark.py", "incremental_acceptance.json"}
          for artifact in artifacts:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      names = archive.namelist()
              else:
                  with tarfile.open(artifact) as archive:
                      names = archive.getnames()
              forbidden = []
              for name in names:
                  path = PurePosixPath(name)
                  if (set(path.parts) & private_dirs or path.name in development_files
                          or path.name.startswith("test_") or path.name.endswith("_acceptance.py")
                          or path.name == ".env" or path.name.startswith(".env.") and path.name != ".env.example"):
                      forbidden.append(name)
              if forbidden:
                  raise SystemExit(f"development/private files in {artifact.name}: {forbidden}")
              print(f"{artifact.name}: release payload clean")
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: memleaf-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  verify-artifacts:
    name: Installed artifacts (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - name: Set up native Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download the same candidate distributions
        uses: actions/download-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/
      - name: Verify installed wheel and source distribution contracts
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import venv

          smoke = '''
          import importlib.util
          import json
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import memleaf
          from memleaf.adapters.base import CommandResult, Detection
          from memleaf.adapters.hermes import HermesAdapter, expected_mcp_tool_count

          assert importlib.util.find_spec("memleaf.acceptance") is None

          # Deterministic installed-artifact check; no host/model network calls.
          def verify_host_profile(directory):
              import os
              import queue
              import threading
              import importlib.metadata
              from importlib.resources import files
              from memleaf.host_v2_schema import PROTOCOL_VERSION, tool_definitions

              assert importlib.metadata.version('memleaf') == memleaf.__version__
              provider = files('memleaf').joinpath('hermes_provider', 'plugin.yaml').read_text(encoding='utf-8')
              assert f'version: {memleaf.__version__}' in provider.splitlines()
              assert len(tool_definitions()) == 7
              clean_env = {key: value for key, value in os.environ.items()
                           if not key.endswith('API_KEY') and not key.startswith('MEMLEAF_')}
              vault = Path(directory) / 'host-vault'
              setup = subprocess.run([sys.executable, '-m', 'memleaf', 'host-grant', '--vault', str(vault),
                                      '--principal', 'codex-ci', '--accept-caller-asserted', '--json'],
                                     env=clean_env, capture_output=True, text=True, check=True, timeout=30)
              configured = json.loads(setup.stdout)
              assert configured['status'] == 'success'
              token = Path(configured['credential_file'])
              assert token.is_file()
              assert memleaf.Memleaf(vault).router is None
              command = [sys.executable, '-m', 'memleaf.mcp_server', '--vault', str(vault),
                         '--profile', 'host', '--token-file', str(token)]

              class Client:
                  def __init__(self):
                      self.process = subprocess.Popen(command, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
                                                      stderr=subprocess.PIPE, text=True, encoding='utf-8', env=clean_env)
                      self.rows = queue.Queue()
                      self.sequence = 0
                      def receive():
                          for line in self.process.stdout:
                              self.rows.put(line)
                          self.rows.put(None)
                      self.reader = threading.Thread(target=receive, daemon=True)
                      self.reader.start()
                      self.request('initialize', {'protocolVersion': '2025-11-25', 'capabilities': {},
                                                  'clientInfo': {'name': 'codex-installed-contract', 'version': '1'}})
                  def request(self, method, params):
                      self.sequence += 1
                      self.process.stdin.write(json.dumps({'jsonrpc': '2.0', 'id': self.sequence,
                                                'method': method, 'params': params}) + '\\n')
                      self.process.stdin.flush()
                      line = self.rows.get(timeout=30)
                      assert line is not None, 'host MCP exited before response'
                      response = json.loads(line)
                      assert 'error' not in response, response
                      return response['result']
                  def tool(self, name, arguments):
                      if name in {row['name'] for row in tool_definitions()}:
                          arguments = {'protocol_version': PROTOCOL_VERSION, **arguments}
                      response = self.request('tools/call', {'name': name, 'arguments': arguments})
                      assert not response.get('isError'), response
                      result = response['structuredContent']
                      assert result.get('ok', True), result
                      return result.get('data', result)
                  def close(self):
                      try:
                          self.process.stdin.close()
                          self.process.wait(timeout=10)
                      except (BrokenPipeError, subprocess.TimeoutExpired):
                          self.process.kill()
                          self.process.wait(timeout=10)
                      finally:
                          self.reader.join(timeout=5)
                          self.process.stdout.close()
                          self.process.stderr.close()

              writer = Client()
              try:
                  names = {row['name'] for row in writer.request('tools/list', {})['tools']}
                  assert {row['name'] for row in tool_definitions()} <= names
                  assert {'search', 'read', 'capture', 'list_todos'} <= names
                  assert not {'remember', 'process', 'save_turn'} & names
                  capabilities = writer.tool('memory_capabilities', {})
                  assert capabilities['executor'] == 'host'
                  assert not capabilities['sampling_required'] and not capabilities['independent_model_fallback']
                  text = 'The delivery project uses SQLite and is currently active.'
                  prepared = writer.tool('prepare_memory', {'mode': 'new', 'purpose': 'explicit', 'request_id': 'create-prepare',
                      'source': {'kind': 'inline', 'messages': [{'role': 'user', 'text': text}]}})
                  work, snapshot = prepared['work'], prepared['snapshot']
                  sources = writer.tool('memory_work', {'view': 'sources', 'work_id': work['work_id'],
                      'snapshot_id': snapshot['snapshot_id'], 'source_refs': ['e1']})
                  assert sources['fragments'][0]['text'] == text
                  args = {'work_id': work['work_id'], 'snapshot_id': snapshot['snapshot_id'],
                      'request_id': 'create-submit', 'expected_work_revision': work['work_revision'],
                      'submission_revision': 1, 'items': [{'item_id': 'A', 'action': 'CREATE', 'assertion_kind': 'user_fact',
                          'memory': {'title': 'SQLite delivery project', 'body': text, 'type': 'project',
                                     'actionable': True, 'status': 'active', 'scopes': ['global']},
                          'evidence': [{'source': 'e1', 'quote': text}]}],
                      'coverage': [{'source': 'e1', 'item_ids': ['A']}], 'basis_coverage': []}
                  saved = writer.tool('submit_memory', args)
                  receipt = saved['items'][0]
                  assert (receipt['status'], receipt['applied'], receipt['settled']) == ('saved', True, True)
                  assert saved['usage']['memleaf_model_calls'] == 0
                  memory_id = receipt['memory_ids'][0]
                  replay = writer.tool('submit_memory', args)
                  assert replay['replayed'] and replay['items'][0]['operation_id'] == receipt['operation_id']
                  assert replay['work']['budget']['used'] == 1
                  text2 = 'Cancel the delivery project; keep its SQLite requirement.'
                  prepared2 = writer.tool('prepare_memory', {'mode': 'new', 'purpose': 'explicit', 'request_id': 'update-prepare',
                      'source': {'kind': 'inline', 'messages': [{'role': 'user', 'text': text2}]},
                      'read_context': {'priority_memory_ids': [memory_id]}})
                  work2, snapshot2 = prepared2['work'], prepared2['snapshot']
                  target = next(row['ref'] for row in snapshot2['targets'] if row['memory_id'] == memory_id)
                  writer.tool('memory_work', {'view': 'targets', 'work_id': work2['work_id'],
                      'snapshot_id': snapshot2['snapshot_id'], 'target_refs': [target]})
                  updated = writer.tool('submit_memory', {'work_id': work2['work_id'], 'snapshot_id': snapshot2['snapshot_id'],
                      'request_id': 'update-submit', 'expected_work_revision': work2['work_revision'], 'submission_revision': 1,
                      'items': [{'item_id': 'U', 'action': 'UPDATE', 'update_kind': 'patch', 'target': target,
                          'fields': {'status': 'cancelled'}, 'transition': 'normal', 'assertion_kind': 'user_decision',
                          'evidence': [{'source': 'e1', 'quote': text2}]}],
                      'coverage': [{'source': 'e1', 'item_ids': ['U']}], 'basis_coverage': []})
                  assert updated['items'][0]['memory_ids'] == [memory_id]
                  assert updated['items'][0]['applied'] and updated['items'][0]['settled']
                  assert updated['usage']['memleaf_model_calls'] == 0
              finally:
                  writer.close()
              reader = Client()
              try:
                  result = reader.tool('search', {'query': 'SQLite', 'scope': 'global', 'todo_status': 'all'})
                  assert memory_id in {row['memory_id'] for row in result['results']}
                  record = reader.tool('read', {'memory_id': memory_id, 'retrieval_id': result['retrieval_id']})
                  assert record['body'] == text and record['memory_id'] == memory_id
                  service = memleaf.Memleaf(vault)
                  assert service.router is None and service.read(memory_id).status == 'cancelled'
                  assert len(service.vault.list_markdown('knowledge')) == 1
                  assert len(service.vault.list_markdown('history')) == 1
              finally:
                  reader.close()
              return {'host_mcp_tools': len(names), 'host_create_update_replay_restart': 'passed', 'host_model_calls': 0}

          with tempfile.TemporaryDirectory(prefix="memleaf-mcp-contract-") as temp:
              vault = Path(temp) / "vault"
              memleaf.Memleaf.initialize(vault)
              response = subprocess.run(
                  [sys.executable, "-m", "memleaf.mcp_server", "--vault", str(vault)],
                  input=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/list"}) + "\\n",
                  capture_output=True, text=True, check=True, timeout=30,
              )
              tools = json.loads(response.stdout)["result"]["tools"]
              count = len(tools)
              assert count > 0 and len({tool["name"] for tool in tools}) == count
              assert expected_mcp_tool_count() == count
              detection = Detection("hermes", True, "high", executable="hermes")
              def runner(argv, **kwargs):
                  assert argv == ["hermes", "mcp", "test", "memleaf"]
                  return CommandResult(0, f"Tools discovered: {count}")
              adapter = HermesAdapter(home=Path(temp), runner=runner)
              assert adapter.test_mcp(detection)
              assert not adapter.test_mcp(detection, expected_tools=count + 1)
          with tempfile.TemporaryDirectory(prefix="memleaf-host-contract-") as host_temp:
              host_result = verify_host_profile(host_temp)
          print(json.dumps({"version": memleaf.__version__, "mcp_tools": count,
                            "hermes_mcp_check": "passed", **host_result}))
          '''
          import textwrap
          smoke = textwrap.dedent(smoke)

          dist = Path("dist")
          artifacts = sorted(dist.glob("*.whl")) + sorted(dist.glob("*.tar.gz"))
          if len(artifacts) != 2:
              raise SystemExit(f"expected exactly one wheel and one sdist, got {artifacts}")
          evidence = Path("artifact-verification")
          evidence.mkdir()

          for artifact in artifacts:
              with tempfile.TemporaryDirectory(prefix="memleaf-install-") as temp:
                  environment = Path(temp) / "venv"
                  venv.EnvBuilder(with_pip=True).create(environment)
                  python = environment / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
                  if artifact.suffixes[-2:] == [".tar", ".gz"]:
                      subprocess.run(
                          [str(python), "-m", "pip", "install", "--upgrade", "setuptools>=77", "wheel"],
                          check=True,
                      )
                  subprocess.run(
                      [
                          str(python), "-m", "pip", "install", "--no-deps",
                          "--no-build-isolation", str(artifact.resolve()),
                      ],
                      check=True,
                  )
                  result = subprocess.run(
                      [str(python), "-c", smoke],
                      check=True, capture_output=True, text=True,
                  )
                  (evidence / f"{artifact.name}.json").write_text(
                      json.dumps({"artifact": artifact.name, **json.loads(result.stdout)}),
                      encoding="utf-8",
                  )
      - name: Upload installation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-artifacts-${{ matrix.os }}-py${{ matrix.python }}
          path: artifact-verification/
          if-no-files-found: warn

  release:
    needs: [build, verify-artifacts]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@v4

      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/

      - name: Prepare release metadata from pyproject and CHANGELOG
        id: release_meta
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          SUBJECT="$(git log -1 --pretty=%s)"
          test "$SUBJECT" = "release: v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          python - "$VERSION" <<'PY'
          from pathlib import Path
          import sys

          version = sys.argv[1]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          prefix = f"## {version}"
          start = next((i for i, line in enumerate(lines) if line.startswith(prefix)), None)
          if start is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          end = next(
              (i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")),
              len(lines),
          )
          notes = "\n".join(lines[start:end]).strip() + "\n"
          Path("/tmp/memleaf-release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          RELEASE_SHA="$GITHUB_SHA"
          test -f "dist/memleaf-${VERSION}-py3-none-any.whl"
          test -f "dist/memleaf-${VERSION}.tar.gz"
          (
            cd dist
            sha256sum "memleaf-${VERSION}-py3-none-any.whl" "memleaf-${VERSION}.tar.gz" > SHA256SUMS
          )

          verify_existing_release() {
            python - "$TAG" "$RELEASE_SHA" "$VERSION" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          tag, expected_sha, version = sys.argv[1:]
          repository = os.environ["GITHUB_REPOSITORY"]
          expected_paths = {
              f"memleaf-{version}-py3-none-any.whl": Path("dist") / f"memleaf-{version}-py3-none-any.whl",
              f"memleaf-{version}.tar.gz": Path("dist") / f"memleaf-{version}.tar.gz",
              "SHA256SUMS": Path("dist") / "SHA256SUMS",
          }

          def gh_json(endpoint):
              return json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))

          commit = gh_json(f"repos/{repository}/commits/{tag}")
          if commit.get("sha") != expected_sha:
              raise SystemExit("release_target_changed")
          release = gh_json(f"repos/{repository}/releases/tags/{tag}")
          assets = {item.get("name"): item for item in release.get("assets", [])}

          def digest(data):
              return hashlib.sha256(data).hexdigest()

          for name, path in expected_paths.items():
              if not path.is_file() or name not in assets:
                  raise SystemExit(f"release_asset_missing:{name}")
              asset = assets[name]
              if asset.get("state") != "uploaded" or not isinstance(asset.get("id"), int):
                  raise SystemExit(f"release_asset_incomplete:{name}")
              remote = subprocess.check_output([
                  "gh", "api", "-H", "Accept: application/octet-stream",
                  f"repos/{repository}/releases/assets/{asset['id']}",
              ])
              if digest(path.read_bytes()) != digest(remote):
                  raise SystemExit(f"release_asset_conflict:{name}")
          PY
          }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            verify_existing_release
          elif gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "memleaf ${VERSION}" \
              --notes-file /tmp/memleaf-release-notes.md \
              --latest \
              "dist/memleaf-${VERSION}-py3-none-any.whl" \
              "dist/memleaf-${VERSION}.tar.gz" \
              dist/SHA256SUMS; then
            verify_existing_release
          else
            # Another release attempt may have won the create race.  Only
            # continue after resolving and validating that release's target.
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            verify_existing_release
          fi

name: Verify bounded maintenance fixes
on: push
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed changes
        run: |
          echo 'ba6e352a204e953434b380e0f1f5f9539c743a867d36d4a0253d221f48aebbb9  .maintenance.patch' | sha256sum -c
          git apply --check .maintenance.patch
          git apply .maintenance.patch
      - name: Run full source contracts
        env:
          PYTHONUTF8: '1'
        run: python -I tests_public/run_contracts.py --tests tests_public --source-root src --report evidence/source.json
      - name: Store only verified implementation objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          expected={'CHANGELOG.md':'44ffd99e787efb24c19145382fbdd945833578c5','docs/body-only-compaction.md':'7395d063e1cb6b22f496f6f2ad646b51e39e8395','docs/native-file-observation.md':'fd528e379010c35bbf876b0b6fd19bff3792b637','src/memleaf/body_compaction.py':'84b66c9e89284f1ea7579d5d9c9927b770592db4','src/memleaf/compaction.py':'e483096372d379ffaef60357c520912e7a9de4e5','src/memleaf/incremental_native.py':'d222d08dd574a14fa35581365d468c214ed8b1e8','tests_public/test_body_compaction.py':'7fb0e401f5d7178d603483c820294f5fa0bcd918','tests_public/test_native_file_observation.py':'0b635e9696feedcb837caad54f078b849d875170','tests_public/test_query_scan_reuse.py':'c1bb5435da3ca13bf53209eb5e3c8d23cab3602c'}
          report=json.loads(Path('evidence/source.json').read_text())
          assert report['status']=='passed' and report['tests']==969
          def post(endpoint,data):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/'+endpoint,data=json.dumps(data).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          entries=[]
          for name,sha in expected.items():
              data=Path(name).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==sha,(name,actual,sha)
              result=post('blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              assert result['sha']==sha
              entries.append({'path':name,'mode':'100644','type':'blob','sha':sha})
          tree=post('trees',{'base_tree':'d2e6cfe3717b5284b623d4b7b75333cd332efd5c','tree':entries})
          Path('evidence/tree.json').write_text(json.dumps({'tree':tree['sha'],'base':'5e707c2f6978c53f5add74f0e814779c55a03f9b','files':expected,'tests':969}))
          print('VERIFIED_TREE='+tree['sha'])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-source-evidence
          path: evidence/
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply changes without rewriting fixture bytes
        run: |
          git apply --check .maintenance.patch
          git apply .maintenance.patch
      - name: Verify focused native cases
        shell: python
        env:
          PYTHONPATH: src;tests_public
          PYTHONUTF8: '1'
        run: |
          import subprocess,sys
          from pathlib import Path
          Path('evidence').mkdir()
          with Path('evidence/windows.log').open('w',encoding='utf-8') as log:
              r=subprocess.run([sys.executable,'-m','unittest','test_body_compaction','test_native_file_observation','test_incremental_native','test_query_scan_reuse','-v'],stdout=log,stderr=subprocess.STDOUT,timeout=300)
          print(Path('evidence/windows.log').read_text(encoding='utf-8',errors='replace')[-15000:])
          sys.exit(r.returncode)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-windows-evidence
          path: evidence/

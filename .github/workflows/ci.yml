name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip build
          python -m pip install .
      - name: Compile source and tests
        run: python -m compileall -q src tests examples
      - name: Run unittest suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build --wheel --sdist
      - name: Verify wheel installation and entry points
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import memleaf; print(memleaf.__version__)"
          memleaf --help
          memleaf --version
          memleaf-mcp --version
      - name: Verify tests from the source distribution
        run: |
          mkdir -p "$RUNNER_TEMP/memleaf-sdist"
          tar -xzf dist/memleaf-*.tar.gz -C "$RUNNER_TEMP/memleaf-sdist"
          cd "$RUNNER_TEMP"/memleaf-sdist/memleaf-*
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_*.py'
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/

  release:
    needs: [test, build]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: 0.1.2')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@v4
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: memleaf-distributions
          path: dist/
      - name: Publish 0.1.2 without replacing any existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f dist/memleaf-0.1.2-py3-none-any.whl
          test -f dist/memleaf-0.1.2.tar.gz
          (cd dist && sha256sum memleaf-0.1.2-py3-none-any.whl memleaf-0.1.2.tar.gz > SHA256SUMS)
          gh release create 0.1.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "memleaf 0.1.2 — AGPL and commercial licensing" \
            --notes-file RELEASE_NOTES_0.1.2.md \
            --latest \
            dist/memleaf-0.1.2-py3-none-any.whl \
            dist/memleaf-0.1.2.tar.gz \
            dist/SHA256SUMS

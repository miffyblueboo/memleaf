name: Apply Windows CI test fix

on:
  push:
    branches:
      - fix/windows-ci-fail-fast

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-ci-fail-fast
          fetch-depth: 0

      - name: Patch the platform-specific command test
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/test_host_events.py")
          text = path.read_text(encoding="utf-8")
          old = '''    def test_host_event_command_quotes_interpreter_and_vault(self) -> None:
                  interpreter = self.root / "venv with space" / "bin" / "python"
                  vault = self.root / "vault with space"
                  command = host_event_command("codex", "Stop", vault, interpreter=interpreter)
                  self.assertEqual(str(interpreter), shlex.split(command)[0])
                  self.assertIn("-m memleaf.cli host-event codex Stop", command)
                  self.assertIn("vault with space", shlex.split(command)[-1])
          '''
          new = '''    def test_posix_host_event_command_quotes_interpreter_and_vault(self) -> None:
                  interpreter = self.root / "venv with space" / "bin" / "python"
                  vault = self.root / "vault with space"
                  command = host_event_command(
                      "codex",
                      "Stop",
                      vault,
                      interpreter=interpreter,
                      platform="posix",
                  )
                  self.assertEqual(str(interpreter), shlex.split(command)[0])
                  self.assertIn("-m memleaf.cli host-event codex Stop", command)
                  self.assertIn("vault with space", shlex.split(command)[-1])
          '''
          if text.count(old) != 1:
              raise SystemExit("expected command test block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Verify the corrected test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m unittest \
            tests.test_host_events.HostEventTests.test_posix_host_event_command_quotes_interpreter_and_vault \
            -v

      - name: Commit the corrected test
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_host_events.py
          git commit -m "test: make host command quoting platform explicit"
          git push origin HEAD:fix/windows-ci-fail-fast

name: Temporary P3 router batch capability

on:
  push:
    branches:
      - automation/p3-router-capability-20260910

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/p3-small-batch-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact P3 head
        run: test "$(git rev-parse HEAD)" = "7ea6440de152bb8a11669fd94e8a2bbd3aa38795"
      - name: Propagate structured batch capability
        shell: python
        run: |
          from pathlib import Path

          router = Path('src/memleaf/llm/router.py')
          source = router.read_text(encoding='utf-8')
          marker = '    @staticmethod\n    def _coerce_host(value: Any) -> Optional[ModelBackend]:\n'
          prop = '''    @property
    def structured_batch_safe(self) -> bool:
        """Expose prompt-level batching only when routing is fixed to a safe API backend."""

        if self.mode == "api":
            return getattr(self.api, "structured_batch_safe", False) is True
        if self.mode == "auto" and self.host is None:
            return getattr(self.api, "structured_batch_safe", False) is True
        return False

'''
          assert source.count(marker) == 1
          router.write_text(source.replace(marker, prop + marker, 1), encoding='utf-8')

          runner = Path('benchmarks/p1/run_baseline.py')
          source = runner.read_text(encoding='utf-8')
          marker = '    @property\n    def calls(self) -> int:\n'
          prop = '''    @property
    def structured_batch_safe(self) -> bool:
        return getattr(self.backend, "structured_batch_safe", False) is True

'''
          assert source.count(marker) == 1
          runner.write_text(source.replace(marker, prop + marker, 1), encoding='utf-8')

          batch = Path('src/memleaf/summary_batch.py')
          source = batch.read_text(encoding='utf-8')
          old = 'BATCH MODE\nApply the single-candidate Summary contract independently to every supplied\nitem.'
          new = 'BATCH MODE\nThis batch envelope replaces only the outer single-item return shape. Apply the\nsingle-candidate Summary contract independently to every supplied item.'
          assert source.count(old) == 1
          batch.write_text(source.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_p3_summary_batch.py')
          source = tests.read_text(encoding='utf-8')
          source = source.replace('from memleaf.summary_batch import run_summary_jobs_with_create_batching\n', 'from memleaf.llm.router import ModelRouter\nfrom memleaf.summary_batch import BATCH_SUMMARIZE_SYSTEM, run_summary_jobs_with_create_batching\n', 1)
          marker = '    def test_backend_without_explicit_batch_capability_uses_original_single_calls(self):\n'
          new_test = '''    def test_router_exposes_batch_capability_only_for_fixed_safe_api_route(self):
        api = _BatchBackend()
        api.complete = lambda *args, **kwargs: "{}"
        api.provider = "synthetic-api"
        api.model = "synthetic-model"
        api_router = ModelRouter(mode="api", api=api)
        self.assertTrue(api_router.structured_batch_safe)
        auto_api_router = ModelRouter(mode="auto", api=api)
        self.assertTrue(auto_api_router.structured_batch_safe)
        host = _LegacyBackend()
        host.complete = lambda *args, **kwargs: "{}"
        host.provider = "host"
        host.model = "host-model"
        auto_host_router = ModelRouter(mode="auto", host=host, api=api)
        self.assertFalse(auto_host_router.structured_batch_safe)
        self.assertIn("replaces only the outer single-item return shape", BATCH_SUMMARIZE_SYSTEM)

'''
          assert source.count(marker) == 1
          tests.write_text(source.replace(marker, new_test + marker, 1), encoding='utf-8')
      - name: Validate routing and budget-wrapper capability
        run: |
          python -m pip install -e .
          python -m py_compile src/memleaf/llm/router.py src/memleaf/summary_batch.py benchmarks/p1/run_baseline.py tests/test_p3_summary_batch.py
          python -m unittest tests.test_p3_summary_batch benchmarks.p1.test_runner -v
      - name: Commit exact routing capability changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/memleaf/llm/router.py src/memleaf/summary_batch.py benchmarks/p1/run_baseline.py tests/test_p3_summary_batch.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m 'feat: propagate P3 batch capability through model routing'
          git push origin HEAD:experiment/p3-small-batch-20260910

name: Temporary P3 router batch capability

on:
  push:
    branches:
      - automation/p3-router-capability-20260910

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Copy patch helper and switch to exact P3 head
        run: |
          cp .github/scripts/temporary_p3_router_capability.py /tmp/p3-router-capability.py
          git fetch origin experiment/p3-small-batch-20260910
          git checkout -B experiment/p3-small-batch-20260910 origin/experiment/p3-small-batch-20260910
          test "$(git rev-parse HEAD)" = "7ea6440de152bb8a11669fd94e8a2bbd3aa38795"
      - name: Apply router capability patch
        run: python /tmp/p3-router-capability.py
      - name: Validate routing and budget-wrapper capability
        run: |
          python -m pip install -e .
          python -m py_compile src/memleaf/llm/router.py src/memleaf/summary_batch.py benchmarks/p1/run_baseline.py tests/test_p3_summary_batch.py
          python -m unittest tests.test_p3_summary_batch benchmarks.p1.test_runner -v
      - name: Commit exact routing capability changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/memleaf/llm/router.py src/memleaf/summary_batch.py benchmarks/p1/run_baseline.py tests/test_p3_summary_batch.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m 'feat: propagate P3 batch capability through model routing'
          git push origin HEAD:experiment/p3-small-batch-20260910

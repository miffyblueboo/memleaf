name: v0.2.38 compatibility fixture fix

on:
  push:
    branches:
      - work/v0.2.38-scope-gate-latency

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.38-scope-gate-latency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align thinking compatibility and scope-maintenance fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count} for {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/memleaf/llm/openai_compatible.py',
              '''    def _thinking_mode(self, purpose: str) -> str:\n        value = self.thinking.get(purpose, "low")\n        return value if value in {"default", "disabled", "low", "high", "max"} else "low"\n''',
              '''    def _thinking_mode(self, purpose: str) -> str:\n        if purpose not in {"gate", "summarize", "compact"}:\n            return "default"\n        value = self.thinking.get(purpose, "low")\n        return value if value in {"default", "disabled", "low", "high", "max"} else "low"\n''',
          )

          replace_once(
              'tests/test_stage_b1.py',
              '''    def test_supported_openai_json_mode_adds_response_format_without_forcing_reasoning_or_budget(self):\n        for provider in ("openai", "deepseek"):\n            for purpose in ("gate", "summarize"):\n                with self.subTest(provider=provider, purpose=purpose):\n                    payload = self._request_payload(provider, purpose)\n                    self.assertEqual(payload["response_format"], {"type": "json_object"})\n                    self.assertNotIn("max_tokens", payload)\n                    self.assertNotIn("thinking", payload)\n\n    def test_deepseek_reasoning_is_not_overridden_for_any_stage(self):\n        compact = self._request_payload("deepseek", "compact")\n        self.assertNotIn("thinking", compact)\n        regular = self._request_payload("deepseek", "chat")\n        self.assertNotIn("response_format", regular)\n        self.assertNotIn("thinking", regular)\n''',
              '''    def test_supported_openai_json_mode_adds_response_format_and_deepseek_low_thinking(self):\n        for provider in ("openai", "deepseek"):\n            for purpose in ("gate", "summarize"):\n                with self.subTest(provider=provider, purpose=purpose):\n                    payload = self._request_payload(provider, purpose)\n                    self.assertEqual(payload["response_format"], {"type": "json_object"})\n                    self.assertNotIn("max_tokens", payload)\n                    if provider == "deepseek":\n                        self.assertEqual(payload["thinking"], {"type": "enabled"})\n                        self.assertEqual(payload["reasoning_effort"], "low")\n                    else:\n                        self.assertNotIn("thinking", payload)\n                        self.assertNotIn("reasoning_effort", payload)\n\n    def test_deepseek_low_thinking_is_limited_to_memleaf_model_stages(self):\n        compact = self._request_payload("deepseek", "compact")\n        self.assertEqual(compact["thinking"], {"type": "enabled"})\n        self.assertEqual(compact["reasoning_effort"], "low")\n        regular = self._request_payload("deepseek", "chat")\n        self.assertNotIn("response_format", regular)\n        self.assertNotIn("thinking", regular)\n        self.assertNotIn("reasoning_effort", regular)\n''',
          )

          replace_once(
              'tests/test_stage_b3d_scope_maintenance.py',
              'def capture_turn(self, *, turn_id="turn-1", prefix="scope", content="move this fact"):',
              'def capture_turn(self, *, turn_id="turn-1", prefix="scope", content="old fact moved to the new project"):',
          )
          replace_once(
              'tests/test_stage_b3d_scope_maintenance.py',
              'service.capture("codex", "s", "turn-1", "user", "move this fact", event_id=f"{name}-user")',
              'service.capture("codex", "s", "turn-1", "user", "old fact moved to the new project", event_id=f"{name}-user")',
          )
          # The idempotency case builds the same scope-maintenance scenario directly.
          replace_once(
              'tests/test_stage_b3d_scope_maintenance.py',
              '"codex", "s", "turn-1", "user", "move this fact", event_id="scope-user"',
              '"codex", "s", "turn-1", "user", "old fact moved to the new project", event_id="scope-user"',
          )
          PY
      - name: Focused regression
        shell: bash
        run: |
          python -m pip install -e .
          python -m compileall -q src tests
          python -m unittest \
            tests.test_stage_b1 \
            tests.test_stage_b3d_scope_maintenance \
            tests.test_gate_scope_latency_v038
      - name: Commit source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/*'
          git diff --cached --check
          git commit -m "test: align low thinking and scope maintenance fixtures [skip ci]"
          git push origin HEAD:work/v0.2.38-scope-gate-latency

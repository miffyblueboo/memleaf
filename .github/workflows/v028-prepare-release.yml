name: v0.2.28 prepare release

on:
  push:
    branches:
      - work/v0.2.28-release

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.28-release
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare version and changelog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_v028_release.py
          python -m compileall -q src tests scripts/benchmark_long_run.py
          python -m pip install -e .
          memleaf --version
          memleaf-mcp --version
          python -m unittest tests.test_stage_c3_packaging tests.test_state_layout_v028 tests.test_config_migrations_v028 -v

      - name: Commit exact release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/v028-prepare-release.yml scripts/prepare_v028_release.py
          git add -A
          git diff --cached --check
          git commit -m 'release: v0.2.28'
          git push origin HEAD:work/v0.2.28-release

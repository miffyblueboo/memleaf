name: Apply reviewed Hermes rollback hardening

on:
  push:
    branches:
      - fix/hermes-mcp-runtime-preflight
    paths:
      - .github/workflows/apply-rollback-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-hermes-rollback-hardening
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/hermes-mcp-runtime-preflight
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed rollback fix and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          installer = Path('src/memleaf/installer.py')
          text = installer.read_text(encoding='utf-8')
          old = '''def _rollback_snapshots(snapshots: list[_PathSnapshot]) -> str:
              try:
                  for snapshot in reversed(snapshots):
                      _restore_snapshot(snapshot)
              except Exception:
                  return "failed"
              return "completed"
          '''
          new = '''def _rollback_snapshots(snapshots: list[_PathSnapshot]) -> str:
              failed = False
              for snapshot in reversed(snapshots):
                  try:
                      _restore_snapshot(snapshot)
                  except Exception:
                      # Continue restoring the remaining paths. The Provider directory is
                      # restored first, and a failure there must not prevent config.yaml
                      # or memleaf.json from being put back.
                      failed = True
              return "failed" if failed else "completed"
          '''
          if text.count(old) != 1:
              raise SystemExit('installer rollback function did not match exactly once')
          installer.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_hermes_runtime_install.py')
          text = tests.read_text(encoding='utf-8')
          old_import = '''from memleaf.installer import (
              _choose_hermes_mcp_command,
              _configure_hermes_mcp_entry,
              _memleaf_mcp_command,
              install_hermes,
          )
          '''
          new_import = '''from memleaf.installer import (
              _PathSnapshot,
              _choose_hermes_mcp_command,
              _configure_hermes_mcp_entry,
              _memleaf_mcp_command,
              _rollback_snapshots,
              install_hermes,
          )
          '''
          if text.count(old_import) != 1:
              raise SystemExit('installer test import block did not match exactly once')
          text = text.replace(old_import, new_import)

          marker = 'class HermesInstallerTransactionTests(unittest.TestCase):\n'
          regression = '''class HermesRollbackTests(unittest.TestCase):
              def test_one_restore_failure_does_not_skip_remaining_snapshots(self) -> None:
                  snapshots = [
                      _PathSnapshot(Path("config.yaml"), "missing"),
                      _PathSnapshot(Path("memleaf.json"), "missing"),
                      _PathSnapshot(Path("provider"), "missing"),
                  ]
                  calls: list[Path] = []

                  def restore(snapshot: _PathSnapshot) -> None:
                      calls.append(snapshot.path)
                      if snapshot.path == Path("provider"):
                          raise OSError("provider restore failed")

                  with mock.patch("memleaf.installer._restore_snapshot", side_effect=restore):
                      status = _rollback_snapshots(snapshots)

                  self.assertEqual("failed", status)
                  self.assertEqual(
                      [Path("provider"), Path("memleaf.json"), Path("config.yaml")],
                      calls,
                  )


          '''
          if 'class HermesRollbackTests' in text:
              raise SystemExit('rollback regression already exists')
          if text.count(marker) != 1:
              raise SystemExit('transaction test marker did not match exactly once')
          tests.write_text(text.replace(marker, regression + marker), encoding='utf-8')
          PY

      - name: Verify reviewed change
        shell: bash
        run: |
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest \
            tests.test_hermes_runtime_install \
            tests.test_pypi_install \
            -v
          git diff --check

      - name: Commit reviewed change and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-rollback-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: continue Hermes rollback after partial restore failure"
          git push origin HEAD:fix/hermes-mcp-runtime-preflight

name: Apply cross-turn dedupe hardening

on:
  push:
    branches:
      - fix/hermes-native-dedup-cross-turn

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply cross-turn dedupe hardening' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hermes-native-dedup-cross-turn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply focused processing patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one patch anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/memleaf/validation.py',
              '''    "固定规则",\n    "以后",\n    "project requirement",\n''',
              '''    "固定规则",\n    "固定流程",\n    "收发流程",\n    "以后",\n    "今后",\n    "后续",\n    "每次",\n    "所有后续",\n    "抄送",\n    "project requirement",\n    "going forward",\n    "from now on",\n''',
          )
          replace_once(
              'src/memleaf/validation.py',
              '''    "处理",\n    "确认",\n    "整改",\n''',
              '''    "处理",\n    "修改",\n    "改完",\n    "截止",\n    "确认",\n    "整改",\n''',
          )
          replace_once(
              'src/memleaf/validation.py',
              '''            r"[;；。！？!?\\n]+|(?:同时|另外|此外|其次|并且|并要求|还需|另需|in addition|separately)",\n''',
              '''            r"[;；。！？!?\\n]+|[,，]\\s*(?=(?:后续|今后|以后|每次|所有后续|going forward|from now on))|(?:同时|另外|此外|其次|并且|并要求|还需|另需|in addition|separately)",\n''',
          )
          replace_once(
              'src/memleaf/prompts.py',
              '''    "summary atomic. Split a durable project rule or implementation-plan "\n    "change from an independent dated todo such as a reply, investigation, "\n    "submission, or follow-up; preserve each part's own evidence and project "\n''',
              '''    "summary atomic. Split a durable project rule, recurring workflow rule, "\n    "or implementation-plan change from an independent dated todo such as a "\n    "reply, investigation, document modification, submission, or follow-up. "\n    "Language such as 后续/今后/以后/每次 or going forward commonly marks a "\n    "separate reusable workflow when paired with an unchanged dated action; "\n    "preserve each part's own evidence and project "\n''',
          )

          replace_once(
              'src/memleaf/processing.py',
              '''def _automatic_transient_memory(value: Any) -> bool:\n    """Reject volatile counters and one-off execution receipts at write time."""\n\n    if not isinstance(value, str):\n        return False\n    return bool(_DERIVED_OVERDUE_RE.search(value) or _EXECUTION_RECEIPT_RE.search(value))\n\n\ndef _todo_state_recovery_candidate(\n''',
              '''def _automatic_transient_memory(value: Any) -> bool:\n    """Reject volatile counters and one-off execution receipts at write time."""\n\n    if not isinstance(value, str):\n        return False\n    return bool(_DERIVED_OVERDUE_RE.search(value) or _EXECUTION_RECEIPT_RE.search(value))\n\n\n_CANDIDATE_LOOKUP_SPLIT = re.compile(\n    r"[;；。！？!?\\n]+|[,，]\\s*(?=(?:后续|今后|以后|每次|所有后续|going forward|from now on))"\n    r"|(?:同时|另外|此外|其次|并且|并要求|还需|另需|in addition|separately)",\n    re.IGNORECASE,\n)\n\n\ndef _candidate_lookup_queries(value: Any) -> list[str]:\n    """Return bounded candidate-level lookup variants for cross-turn dedupe."""\n\n    if not isinstance(value, str) or not value.strip():\n        return []\n    text = value.strip()\n    values = [text]\n    values.extend(part.strip() for part in _CANDIDATE_LOOKUP_SPLIT.split(text) if part.strip())\n    result: list[str] = []\n    seen: set[str] = set()\n    for item in values:\n        normalized = normalize_term(item)\n        if len(normalized) < 4 or normalized in seen:\n            continue\n        seen.add(normalized)\n        result.append(item)\n        if len(result) >= 8:\n            break\n    return result\n\n\ndef _automatic_create_conflicts(\n    candidate: Mapping[str, Any],\n    summary: Mapping[str, Any],\n    related: Iterable[Mapping[str, Any]],\n    *,\n    ignore_memory_id: str | None = None,\n) -> bool:\n    """Fail closed when an automatic CREATE still overlaps active context."""\n\n    candidate_text = str(candidate.get("memory", "")).strip()\n    queries = _candidate_lookup_queries(candidate_text)\n    summary_text = f"{summary.get('title', '')}\\n{summary.get('body', '')}".strip()\n    candidate_type = candidate.get("type")\n    ignored = ignore_memory_id.casefold() if isinstance(ignore_memory_id, str) and ignore_memory_id else None\n    for raw in related:\n        if not isinstance(raw, Mapping):\n            continue\n        memory_id = raw.get("memory_id")\n        if isinstance(memory_id, str) and ignored is not None and memory_id.casefold() == ignored:\n            # A previous transaction attempt may have persisted this exact\n            # deterministic CREATE before failing during native shadow/ledger\n            # commit. Let the idempotent replay finish its remaining work.\n            continue\n        related_text = f"{raw.get('title', '')}\\n{raw.get('body', '')}".strip()\n        related_normalized = normalize_term(related_text)\n        if not related_normalized:\n            continue\n        for query in queries:\n            normalized = normalize_term(query)\n            if len(normalized) >= 8 and (\n                normalized in related_normalized\n                or (len(related_normalized) >= 8 and related_normalized in normalized)\n            ):\n                return True\n        if raw.get("native") is True or raw.get("type") != candidate_type:\n            continue\n        try:\n            memory = Memory.from_mapping(raw)\n        except (TypeError, ValueError):\n            continue\n        if candidate_matches_query(memory, candidate_text) and candidate_matches_query(memory, summary_text):\n            return True\n    return False\n\n\ndef _todo_state_recovery_candidate(\n''',
          )

          replace_once(
              'src/memleaf/processing.py',
              '''        query: str,\n        explicit_scope: Any = None,\n''',
              '''        query: str | Iterable[str],\n        explicit_scope: Any = None,\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''    ]:\n        visible = query.strip() if isinstance(query, str) else ""\n        scope = _safe_scope_background(state, explicit_scope)\n''',
              '''    ]:\n        if isinstance(query, str):\n            query_value: str | list[str] = query.strip()\n        else:\n            query_value = [\n                str(item).strip()\n                for item in query\n                if isinstance(item, str) and item.strip()\n            ]\n        visible = query_value if isinstance(query_value, str) else " ".join(query_value)\n        scope = _safe_scope_background(state, explicit_scope)\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''                records = self.service._search_unlocked(\n                    visible,\n''',
              '''                records = self.service._search_unlocked(\n                    query_value,\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''                        if candidate_matches_query(record.memory, visible)\n''',
              '''                        if candidate_matches_query(record.memory, query_value)\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''                    indexed_native = NativeIndexer(self.service.vault).search_unlocked(\n                        visible,\n''',
              '''                    indexed_native = NativeIndexer(self.service.vault).search_unlocked(\n                        query_value,\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''                str(candidate.get("memory", "")).strip(),\n                candidate_scopes,\n''',
              '''                _candidate_lookup_queries(candidate.get("memory")),\n                candidate_scopes,\n''',
          )

          processing = Path('src/memleaf/processing.py')
          text = processing.read_text(encoding='utf-8')
          start = text.index('    def _infer_update_target(\n')
          end = text.index('    def _defer_candidate(\n', start)
          replacement = '''    def _infer_update_target(\n        self,\n        candidate: Mapping[str, Any],\n        related: Iterable[Mapping[str, Any]],\n    ) -> dict[str, Any]:\n        """Reuse one unambiguous same-scope active memory before CREATE.\n\n        General same-type matching prevents a wrong gate target from escaping\n        into a sibling CREATE. Project-plan candidates retain the specialized\n        project-over-fact preference used by earlier maintenance behavior.\n        """\n\n        result = dict(candidate)\n        if (\n            not result.get("worth")\n            or result.get("duplicate")\n            or any(result.get(field) for field in ("duplicate_memory_id", "update_memory_id"))\n            or not isinstance(result.get("memory"), str)\n        ):\n            return result\n        project_keys = self._project_scope_keys(result.get("scopes"))\n        if len(project_keys) != 1:\n            return result\n\n        candidate_type = result.get("type")\n        candidate_text = result["memory"]\n        same_type_matches: list[Memory] = []\n        seen_same_type: set[str] = set()\n        for item in related:\n            if not isinstance(item, Mapping) or item.get("native") is True:\n                continue\n            memory_id = item.get("memory_id")\n            if (\n                not isinstance(memory_id, str)\n                or item.get("type") != candidate_type\n                or self._project_scope_keys(item.get("scopes")) != project_keys\n                or memory_id.casefold() in seen_same_type\n            ):\n                continue\n            try:\n                target = Memory.from_mapping(item)\n            except (TypeError, ValueError):\n                continue\n            if not candidate_matches_query(target, candidate_text):\n                continue\n            seen_same_type.add(memory_id.casefold())\n            same_type_matches.append(target)\n\n        specialized_plan = (\n            candidate_type in {"fact", "project"}\n            and self._is_project_plan_title(candidate_text)\n        )\n        if not specialized_plan:\n            if len(same_type_matches) > 1:\n                result["_defer_reason"] = "ambiguous_update_target"\n                return result\n            if len(same_type_matches) == 1:\n                result["update_memory_id"] = same_type_matches[0].memory_id\n            return result\n\n        project_matches: list[Memory] = []\n        fact_matches: list[Memory] = []\n        seen: set[str] = set()\n        for item in related:\n            if not isinstance(item, Mapping) or item.get("native") is True:\n                continue\n            memory_id = item.get("memory_id")\n            item_type = item.get("type")\n            item_scopes = item.get("scopes")\n            if (\n                not isinstance(memory_id, str)\n                or not isinstance(item_type, str)\n                or item_type not in {"fact", "project"}\n                or self._project_scope_keys(item_scopes) != project_keys\n                or memory_id.casefold() in seen\n                or not self._is_project_plan_title(item.get("title"))\n                or self._is_adjacent_plan_record(item.get("title"))\n            ):\n                continue\n            try:\n                target = Memory.from_mapping(item)\n            except (TypeError, ValueError):\n                continue\n            seen.add(memory_id.casefold())\n            if target.type == "project":\n                project_matches.append(target)\n            else:\n                fact_matches.append(target)\n\n        if len(project_matches) > 1 or (not project_matches and len(fact_matches) > 1):\n            result["_defer_reason"] = "ambiguous_update_target"\n            return result\n        if project_matches:\n            target = project_matches[0]\n        elif len(fact_matches) == 1:\n            target = fact_matches[0]\n        else:\n            return result\n        result["update_memory_id"] = target.memory_id\n        result["type"] = target.type\n        return result\n\n'''
          processing.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          replace_once(
              'src/memleaf/processing.py',
              '''                target = self.service.read(gate_update_target, include_history=False)\n                summary = self._merge_additive_project_plan_update(candidate, summary, target)\n''',
              '''                target = self.service.read(gate_update_target, include_history=False)\n                if (\n                    target is not None\n                    and normalize_term(str(summary.get("body", ""))) == normalize_term(target.body)\n                ):\n                    # The current evidence does not change the canonical body.\n                    # Automatic processing must not create a history version\n                    # merely to append a repeated observation/source.\n                    continue\n                summary = self._merge_additive_project_plan_update(candidate, summary, target)\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''            requests.append(\n                self._request(\n                    summary,\n                    turn,\n                    candidate_id=str(candidate["candidate_id"]),\n                    conversation_title=title,\n                    native_refs=candidate_native_refs,\n                )\n            )\n''',
              '''            pending_request = self._request(\n                summary,\n                turn,\n                candidate_id=str(candidate["candidate_id"]),\n                conversation_title=title,\n                native_refs=candidate_native_refs,\n            )\n            if gate_update_target is None and _automatic_create_conflicts(\n                candidate,\n                summary,\n                candidate_related,\n                ignore_memory_id=pending_request["memory_id"],\n            ):\n                self._defer_candidate(\n                    turn_ref,\n                    candidate,\n                    "possible_duplicate_target",\n                    scopes=summary["scopes"],\n                    scope_source=summary.get("scope_source"),\n                )\n                continue\n            requests.append(pending_request)\n''',
          )

          replace_once(
              'tests/test_maintenance_v2.py',
              '''        self.assertEqual(self.service.read("mem-alpha-owner").body, "alpha 项目负责人是甲。")\n        self.assertEqual(self.service.read("mem-beta-owner").body, "beta 项目负责人是丙。")\n        self.assertEqual(self.service.vault.list_markdown("history"), [])\n''',
              '''        self.assertEqual(self.service.read("mem-alpha-owner").body, "alpha 项目负责人更新为乙。")\n        self.assertEqual(self.service.read("mem-beta-owner").body, "beta 项目负责人是丙。")\n        history = self.service._read_memories_unlocked("history")\n        self.assertEqual(len(history), 1)\n        self.assertEqual(history[0].memory.extra.get("active_memory_id"), "mem-alpha-owner")\n''',
          )
          replace_once(
              'tests/test_cross_turn_dedupe_regressions.py',
              '''        self.assertEqual(result["memories_written"], 0)\n        self.assertGreaterEqual(result["deferred_candidates"], 1)\n        self.assertEqual([memory.memory_id for memory in self.active()], [existing.memory_id])\n''',
              '''        self.assertEqual(result["memories_written"], 0)\n        self.assertEqual(result["deferred_candidates"], 0)\n        self.assertEqual([memory.memory_id for memory in self.active()], [existing.memory_id])\n''',
          )
          PY
      - name: Run cross-turn regressions
        run: |
          python -m pip install .
          python -m unittest tests.test_cross_turn_dedupe_regressions -v
          python -m unittest tests.test_extraction_quality_regressions tests.test_maintenance_v2 tests.test_stage_b3b_native_context -v
          python -m compileall -q src tests
          git diff --check
      - name: Commit verified dedupe hardening
        shell: bash
        run: |
          git rm .github/workflows/apply-cross-turn-dedupe.yml
          git config user.name 'miffyblueboo'
          git config user.email '321381257+miffyblueboo@users.noreply.github.com'
          git add src/memleaf/processing.py src/memleaf/validation.py src/memleaf/prompts.py tests/test_maintenance_v2.py tests/test_cross_turn_dedupe_regressions.py
          git commit -m 'fix: harden cross-turn update and no-change decisions'
          git push origin HEAD:fix/hermes-native-dedup-cross-turn

name: Apply cross-turn dedupe hardening

on:
  push:
    branches:
      - fix/hermes-native-dedup-cross-turn

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: apply cross-turn dedupe hardening' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hermes-native-dedup-cross-turn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply focused processing patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one patch anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/memleaf/validation.py',
              '''    "固定规则",\n    "以后",\n    "project requirement",\n''',
              '''    "固定规则",\n    "固定流程",\n    "收发流程",\n    "以后",\n    "今后",\n    "后续",\n    "每次",\n    "所有后续",\n    "抄送",\n    "project requirement",\n    "going forward",\n    "from now on",\n''',
          )
          replace_once(
              'src/memleaf/validation.py',
              '''    "处理",\n    "确认",\n    "整改",\n''',
              '''    "处理",\n    "修改",\n    "改完",\n    "截止",\n    "确认",\n    "整改",\n''',
          )
          replace_once(
              'src/memleaf/validation.py',
              '''            r"[;；。！？!?\\n]+|(?:同时|另外|此外|其次|并且|并要求|还需|另需|in addition|separately)",\n''',
              '''            r"[;；。！？!?\\n]+|[,，]\\s*(?=(?:后续|今后|以后|每次|所有后续|going forward|from now on))|(?:同时|另外|此外|其次|并且|并要求|还需|另需|in addition|separately)",\n''',
          )
          replace_once(
              'src/memleaf/prompts.py',
              '''    "summary atomic. Split a durable project rule or implementation-plan "\n    "change from an independent dated todo such as a reply, investigation, "\n    "submission, or follow-up; preserve each part's own evidence and project "\n''',
              '''    "summary atomic. Split a durable project rule, recurring workflow rule, "\n    "or implementation-plan change from an independent dated todo such as a "\n    "reply, investigation, document modification, submission, or follow-up. "\n    "Language such as 后续/今后/以后/每次 or going forward commonly marks a "\n    "separate reusable workflow when paired with an unchanged dated action; "\n    "preserve each part's own evidence and project "\n''',
          )

          replace_once(
              'src/memleaf/processing.py',
              '''def _automatic_transient_memory(value: Any) -> bool:\n    """Reject volatile counters and one-off execution receipts at write time."""\n\n    if not isinstance(value, str):\n        return False\n    return bool(_DERIVED_OVERDUE_RE.search(value) or _EXECUTION_RECEIPT_RE.search(value))\n\n\ndef _todo_state_recovery_candidate(\n''',
              '''def _automatic_transient_memory(value: Any) -> bool:\n    """Reject volatile counters and one-off execution receipts at write time."""\n\n    if not isinstance(value, str):\n        return False\n    return bool(_DERIVED_OVERDUE_RE.search(value) or _EXECUTION_RECEIPT_RE.search(value))\n\n\n_CANDIDATE_LOOKUP_SPLIT = re.compile(\n    r"[;；。！？!?\\n]+|[,，]\\s*(?=(?:后续|今后|以后|每次|所有后续|going forward|from now on))"\n    r"|(?:同时|另外|此外|其次|并且|并要求|还需|另需|in addition|separately)",\n    re.IGNORECASE,\n)\n\n\ndef _candidate_lookup_queries(value: Any) -> list[str]:\n    """Return bounded candidate-level lookup variants for cross-turn dedupe."""\n\n    if not isinstance(value, str) or not value.strip():\n        return []\n    text = value.strip()\n    values = [text]\n    values.extend(part.strip() for part in _CANDIDATE_LOOKUP_SPLIT.split(text) if part.strip())\n    result: list[str] = []\n    seen: set[str] = set()\n    for item in values:\n        normalized = normalize_term(item)\n        if len(normalized) < 4 or normalized in seen:\n            continue\n        seen.add(normalized)\n        result.append(item)\n        if len(result) >= 8:\n            break\n    return result\n\n\ndef _automatic_create_conflicts(\n    candidate: Mapping[str, Any],\n    summary: Mapping[str, Any],\n    related: Iterable[Mapping[str, Any]],\n) -> bool:\n    """Fail closed when an automatic CREATE still overlaps active context."""\n\n    candidate_text = str(candidate.get("memory", "")).strip()\n    queries = _candidate_lookup_queries(candidate_text)\n    summary_text = f"{summary.get('title', '')}\\n{summary.get('body', '')}".strip()\n    candidate_type = candidate.get("type")\n    for raw in related:\n        if not isinstance(raw, Mapping):\n            continue\n        related_text = f"{raw.get('title', '')}\\n{raw.get('body', '')}".strip()\n        related_normalized = normalize_term(related_text)\n        if not related_normalized:\n            continue\n        for query in queries:\n            normalized = normalize_term(query)\n            if len(normalized) >= 8 and (\n                normalized in related_normalized\n                or (len(related_normalized) >= 8 and related_normalized in normalized)\n            ):\n                return True\n        if raw.get("native") is True or raw.get("type") != candidate_type:\n            continue\n        try:\n            memory = Memory.from_mapping(raw)\n        except (TypeError, ValueError):\n            continue\n        if candidate_matches_query(memory, candidate_text) and candidate_matches_query(memory, summary_text):\n            return True\n    return False\n\n\ndef _todo_state_recovery_candidate(\n''',
          )

          replace_once(
              'src/memleaf/processing.py',
              '''        query: str,\n        explicit_scope: Any = None,\n''',
              '''        query: str | Iterable[str],\n        explicit_scope: Any = None,\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''    ]:\n        visible = query.strip() if isinstance(query, str) else ""\n        scope = _safe_scope_background(state, explicit_scope)\n''',
              '''    ]:\n        if isinstance(query, str):\n            query_value: str | list[str] = query.strip()\n        else:\n            query_value = [\n                str(item).strip()\n                for item in query\n                if isinstance(item, str) and item.strip()\n            ]\n        visible = query_value if isinstance(query_value, str) else " ".join(query_value)\n        scope = _safe_scope_background(state, explicit_scope)\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''                records = self.service._search_unlocked(\n                    visible,\n''',
              '''                records = self.service._search_unlocked(\n                    query_value,\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''                        if candidate_matches_query(record.memory, visible)\n''',
              '''                        if candidate_matches_query(record.memory, query_value)\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''                    indexed_native = NativeIndexer(self.service.vault).search_unlocked(\n                        visible,\n''',
              '''                    indexed_native = NativeIndexer(self.service.vault).search_unlocked(\n                        query_value,\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''                str(candidate.get("memory", "")).strip(),\n                candidate_scopes,\n''',
              '''                _candidate_lookup_queries(candidate.get("memory")),\n                candidate_scopes,\n''',
          )
          replace_once(
              'src/memleaf/processing.py',
              '''            requests.append(\n                self._request(\n                    summary,\n''',
              '''            if gate_update_target is None and _automatic_create_conflicts(\n                candidate, summary, candidate_related\n            ):\n                self._defer_candidate(\n                    turn_ref,\n                    candidate,\n                    "possible_duplicate_target",\n                    scopes=summary["scopes"],\n                    scope_source=summary.get("scope_source"),\n                )\n                continue\n            requests.append(\n                self._request(\n                    summary,\n''',
          )
          PY
      - name: Run cross-turn regressions
        run: |
          python -m pip install .
          python -m unittest tests.test_cross_turn_dedupe_regressions -v
          python -m unittest tests.test_extraction_quality_regressions tests.test_maintenance_v2 tests.test_stage_b3b_native_context -v
          python -m compileall -q src tests
          git diff --check
      - name: Commit verified dedupe hardening
        shell: bash
        run: |
          git rm .github/workflows/apply-cross-turn-dedupe.yml
          git config user.name 'miffyblueboo'
          git config user.email '321381257+miffyblueboo@users.noreply.github.com'
          git add src/memleaf/processing.py src/memleaf/validation.py src/memleaf/prompts.py
          git commit -m 'fix: harden cross-turn update and no-change decisions'
          git push origin HEAD:fix/hermes-native-dedup-cross-turn

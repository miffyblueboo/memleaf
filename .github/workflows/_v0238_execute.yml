name: execute v0.2.38 source patch

on:
  push:
    branches:
      - work/v0.2.38-scope-gate-latency

permissions:
  contents: write

jobs:
  execute:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.38-scope-gate-latency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v0.2.38 source patch
        run: python _v0238_patch.py
      - name: Compile and run focused regressions
        shell: bash
        run: |
          python -m compileall -q src tests
          python -m unittest \
            tests.test_gate_scope_latency_v038 \
            tests.test_new_scope_source_grounding \
            tests.test_v023_scope_correction \
            tests.test_processing_observability_concurrency \
            tests.test_model_discovery
      - name: Commit source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/*'
          git diff --cached --check
          git commit -m "fix: unify scope grounding and reduce gate latency [skip ci]"
          git push origin HEAD:work/v0.2.38-scope-gate-latency

name: Apply Hermes native wiring

on:
  push:
    branches:
      - fix/hermes-native-dedup-cross-turn

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: wire Hermes native sources' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hermes-native-dedup-cross-turn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply focused installer wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one patch anchor, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/memleaf/installer.py',
              'from .locking import atomic_write_json\nfrom .vault import Vault\n',
              'from .locking import atomic_write_json\nfrom .native_registration import ensure_hermes_native_sources\nfrom .vault import Vault\n',
          )
          replace_once(
              'src/memleaf/installer.py',
              '''        return {\n            "status": "failure",\n            "reason": "Hermes MCP test did not confirm 11 tools",\n            "core_version": core_version,\n            "provider_version": provider_version,\n            "vault": str(vault.root),\n            "provider": str(provider_path),\n            "model": model,\n        }\n\n    update_agents_index(\n''',
              '''        return {\n            "status": "failure",\n            "reason": "Hermes MCP test did not confirm 11 tools",\n            "core_version": core_version,\n            "provider_version": provider_version,\n            "vault": str(vault.root),\n            "provider": str(provider_path),\n            "model": model,\n        }\n\n    try:\n        native_registration = ensure_hermes_native_sources(vault, hermes_home)\n    except Exception:\n        return {\n            "status": "failure",\n            "reason": "Hermes native memory sources could not be registered safely",\n            "core_version": core_version,\n            "provider_version": provider_version,\n            "vault": str(vault.root),\n            "provider": str(provider_path),\n            "model": model,\n        }\n\n    update_agents_index(\n''',
          )
          replace_once(
              'src/memleaf/installer.py',
              '''        "mcp_command": str(command),\n        "model": model,\n    }\n''',
              '''        "mcp_command": str(command),\n        "model": model,\n        "native_sources": native_registration,\n    }\n''',
          )
          replace_once(
              'install.sh',
              '''  fi\n\n  # The MCP status is written only after its own official test succeeds.  This\n''',
              '''  fi\n\n  # Register Hermes' own MEMORY.md and USER.md as private, read-only native\n  # sources only after both provider and MCP checks have succeeded. Missing\n  # files remain a valid indexed state and are never created by memleaf.\n  "$venv_path/bin/python" - "$vault_path" "$hermes_home" <<'PY'\nfrom __future__ import annotations\n\nimport sys\nfrom pathlib import Path\n\nfrom memleaf.native_registration import ensure_hermes_native_sources\nfrom memleaf.vault import Vault\n\nvault = Vault(Path(sys.argv[1]).expanduser().resolve())\nhermes_home = Path(sys.argv[2]).expanduser().resolve()\nensure_hermes_native_sources(vault, hermes_home)\nPY\n\n  # The MCP status is written only after its own official test succeeds.  This\n''',
          )
          PY
      - name: Run focused regression tests
        run: |
          python -m pip install .
          python -m unittest tests.test_hermes_native_registration -v
          python -m unittest tests.test_pypi_install tests.test_upgrade_preserves_vault -v
          python -m compileall -q src tests
          git diff --check
      - name: Commit verified wiring
        shell: bash
        run: |
          git rm .github/workflows/apply-native-wiring.yml
          git config user.name 'miffyblueboo'
          git config user.email '321381257+miffyblueboo@users.noreply.github.com'
          git add src/memleaf/installer.py install.sh
          git commit -m 'fix: wire Hermes native sources into installers'
          git push origin HEAD:fix/hermes-native-dedup-cross-turn

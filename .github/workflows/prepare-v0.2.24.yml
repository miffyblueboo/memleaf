name: Prepare v0.2.24 release metadata

on:
  push:
    branches: ["release/v0.2.24"]
    paths:
      - ".github/workflows/prepare-v0.2.24.yml"

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.2.24
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update version metadata and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "pyproject.toml": [('version = "0.2.23"', 'version = "0.2.24"')],
              "src/memleaf/__init__.py": [('__version__ = "0.2.23"', '__version__ = "0.2.24"')],
              "src/memleaf/hermes_provider/plugin.yaml": [('version: 0.2.23', 'version: 0.2.24')],
              "README.md": [
                  ('**当前版本：0.2.23。**', '**当前版本：0.2.24。**'),
                  ('memleaf 0.2.23 通过 PyPI 分发。', 'memleaf 0.2.24 通过 PyPI 分发。'),
              ],
              "README.en.md": [
                  ('**Version: 0.2.23.**', '**Version: 0.2.24.**'),
                  ('memleaf 0.2.23 is distributed through PyPI.', 'memleaf 0.2.24 is distributed through PyPI.'),
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{name}: expected exactly one {old!r}, found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          anchor = "## 0.2.23 — 2026-09-03\n"
          if text.count(anchor) != 1:
              raise SystemExit("unexpected CHANGELOG anchor")
          section = """## 0.2.24 — 2026-09-04

          - Make Hermes MCP installation reliably persistent: write `mcp_servers.memleaf` through Hermes' canonical `config set` interface, disable the entry while command/arguments are updated, then read `config.yaml` back and require an exact command plus `--vault` match before reporting success.
          - Detect a same-Vault MCP entry that points at a different absolute memleaf runtime before changing Hermes. Add explicit `--mcp-runtime auto|current|existing` policies, prefer the current Python interpreter's scripts directory over `PATH`, and require an exact version check before retaining another environment.
          - Snapshot Hermes `config.yaml`, `memleaf.json`, and `plugins/memleaf` during installation; on a later failure, attempt every rollback target even when one restore fails, and report the failed paths together with the installation stage and recovery commands.
          - Improve human and JSON diagnostics for MCP persistence, runtime conflicts, lifecycle/test failures, and rollback results; document `memleaf-mcp --vault`, manual YAML, and the difference between Hermes connection discovery and final configuration persistence.
          - Make Windows CI fail immediately after every native command and keep POSIX command-rendering assertions platform-specific, preventing intermediate Windows test failures from being reported as green.
          - Leave memory extraction, CREATE/UPDATE/NO_CHANGE decisions, retrieval, injection, todo handling, and globally shared Vault visibility unchanged.

          """
          changelog.write_text(text.replace(anchor, section + anchor), encoding="utf-8")
          PY

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests examples
          PYTHONPATH=src python -m unittest tests.test_pypi_install tests.test_hermes_runtime_install -v
          PYTHONPATH=src python - <<'PY'
          import tomllib
          from pathlib import Path
          import memleaf

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          provider = next(
              line.split(":", 1)[1].strip()
              for line in Path("src/memleaf/hermes_provider/plugin.yaml").read_text(encoding="utf-8").splitlines()
              if line.startswith("version:")
          )
          assert version == memleaf.__version__ == provider == "0.2.24"
          assert Path("CHANGELOG.md").read_text(encoding="utf-8").count("## 0.2.24 — 2026-09-04") == 1
          PY
          git diff --check

      - name: Commit prepared release tree and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-v0.2.24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md README.en.md pyproject.toml src/memleaf/__init__.py src/memleaf/hermes_provider/plugin.yaml .github/workflows/prepare-v0.2.24.yml
          git commit -m "chore: finalize v0.2.24 release metadata"
          git push origin HEAD:release/v0.2.24

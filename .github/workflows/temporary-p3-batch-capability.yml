name: Temporary P3 batch capability

on:
  push:
    branches:
      - automation/p3-batch-capability-20260910

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Copy patch helper and switch to exact P3 head
        run: |
          cp .github/scripts/temporary_p3_batch_capability.py /tmp/p3-batch-capability.py
          git fetch origin experiment/p3-small-batch-20260910
          git checkout -B experiment/p3-small-batch-20260910 origin/experiment/p3-small-batch-20260910
          test "$(git rev-parse HEAD)" = "a2a522a60899569e963dc295661d15d9be8fe43e"
      - name: Apply capability patch
        run: python /tmp/p3-batch-capability.py
      - name: Validate capability and helper behavior
        run: |
          python -m pip install -e .
          python -m py_compile src/memleaf/llm/base.py src/memleaf/summary_batch.py tests/test_p3_summary_batch.py
          python -m unittest tests.test_p3_summary_batch -v
          python -c "from memleaf.llm.base import CallableBackend, HTTPModelBackend; assert CallableBackend.structured_batch_safe is False; assert HTTPModelBackend.structured_batch_safe is True"
      - name: Commit exact capability changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/memleaf/llm/base.py src/memleaf/summary_batch.py tests/test_p3_summary_batch.py
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "3"
          git commit -m 'feat: gate P3 batching by backend capability'
          git push origin HEAD:experiment/p3-small-batch-20260910

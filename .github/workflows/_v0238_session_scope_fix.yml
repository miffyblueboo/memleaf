name: v0.2.38 session scope source fix

on:
  push:
    branches:
      - work/v0.2.38-scope-gate-latency

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.actor != 'github-actions[bot]' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v0.2.38-scope-gate-latency
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align inherited Scope source semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)} for {old[:90]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Main Gate contract: make scope_source semantics explicit.
          replace_once(
              'src/memleaf/prompts.py',
              'Scopes must be grounded by authoritative user/session context or the candidate\'s own evidence. A single project name stated in the candidate\'s bound source text is sufficient for project:<name> with scope_source=model, even when that project is absent from the current registry; do not use unscoped merely because the registry is empty.',
              'Scopes must be grounded by authoritative user/session context or the candidate\'s own evidence. When a project comes from the supplied Session scope background rather than this candidate\'s bound source, copy that project with scope_source=session_context; do not label an inherited project as model. A single project name stated in the candidate\'s bound source text is sufficient for project:<name> with scope_source=model, even when that project is absent from the current registry; do not use unscoped merely because the registry is empty.',
          )
          replace_once(
              'src/memleaf/prompts.py',
              'memory, session background, or unrelated aggregate context. When source text ',
              'memory or unrelated aggregate context. If the selected project is supplied by Session scope background instead of the candidate\'s bound source, keep the project but change scope_source to session_context. When source text ',
          )
          replace_once(
              'src/memleaf/prompts.py',
              'For Scope, a model-selected project must be named (or matched by a registered\nalias) in that candidate\'s exact source. Distinguish ownership/affiliation from',
              'For Scope, a model-selected project must be named (or matched by a registered\nalias) in that candidate\'s exact source. A project inherited from Session scope\nbackground must use scope_source=session_context instead of model. Distinguish ownership/affiliation from',
          )

          # Maintenance sparse follow-up: project name is inherited from the session.
          path = 'tests/test_maintenance_v2.py'
          replace_once(
              path,
              '''                            scopes=["project:alpha"],\n                            type="project",\n                            update_memory_id=old.memory_id,\n''',
              '''                            scopes=["project:alpha"],\n                            scope_source="session_context",\n                            type="project",\n                            update_memory_id=old.memory_id,\n''',
          )
          replace_once(
              path,
              '''                    scopes=["project:alpha"],\n                    type="project",\n                    update_memory_id=old.memory_id,\n''',
              '''                    scopes=["project:alpha"],\n                    scope_source="session_context",\n                    type="project",\n                    update_memory_id=old.memory_id,\n''',
          )

          # Session-lineage helpers need to model the actual origin explicitly.
          replace_once(
              'tests/test_session_lineage.py',
              'def candidate(candidate_id, evidence, memory, *, scopes, update_memory_id=None):',
              'def candidate(candidate_id, evidence, memory, *, scopes, scope_source="model", update_memory_id=None):',
          )
          replace_once(
              'tests/test_session_lineage.py',
              '        "scope_source": "model",\n    }\n    if update_memory_id is not None:',
              '        "scope_source": scope_source,\n    }\n    if update_memory_id is not None:',
          )
          replace_once(
              'tests/test_session_lineage.py',
              'def summary(event, body, *, title, scopes, update_memory_id=None):',
              'def summary(event, body, *, title, scopes, scope_source="model", update_memory_id=None):',
          )
          replace_once(
              'tests/test_session_lineage.py',
              '        "scope_source": "model",\n        "sources": [{"event_key": event}],',
              '        "scope_source": scope_source,\n        "sources": [{"event_key": event}],',
          )

          # Exactly two inherited child-update fixtures in this file.
          p = Path('tests/test_session_lineage.py')
          text = p.read_text(encoding='utf-8')
          old = '''                            scopes=["project:alpha"],\n                            update_memory_id=old.memory_id,\n'''
          new = '''                            scopes=["project:alpha"],\n                            scope_source="session_context",\n                            update_memory_id=old.memory_id,\n'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'test_session_lineage candidate inherited fixtures: expected 2, got {count}')
          text = text.replace(old, new)
          old = '''                    scopes=["project:alpha"],\n                    update_memory_id=old.memory_id,\n'''
          new = '''                    scopes=["project:alpha"],\n                    scope_source="session_context",\n                    update_memory_id=old.memory_id,\n'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'test_session_lineage summary inherited fixtures: expected 2, got {count}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Focused inherited-scope regression
        shell: bash
        run: |
          python -m pip install -e .
          python -m compileall -q src tests
          python -m unittest \
            tests.test_maintenance_v2 \
            tests.test_session_lineage \
            tests.test_gate_scope_latency_v038 \
            tests.test_new_scope_source_grounding
      - name: Commit source only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/*'
          git diff --cached --check
          git commit -m "fix: distinguish inherited project scope source [skip ci]"
          git push origin HEAD:work/v0.2.38-scope-gate-latency

name: P2 input slimming

on:
  push:
    branches:
      - experiment/p2-prompt-input-slim-20260910
  pull_request:
    branches:
      - experiment/p1-baseline-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p2-input-slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile P2 assets
        run: python -m py_compile benchmarks/p2/static_prompt_audit.py benchmarks/p2/test_static_prompt_audit.py benchmarks/p2/summary_prompt_audit.py benchmarks/p2/test_summary_input_slim.py benchmarks/p2/test_system_prompt_slim.py
      - name: Validate P2 input and system prompt slimming
        run: |
          python -m unittest benchmarks.p2.test_static_prompt_audit benchmarks.p2.test_summary_input_slim benchmarks.p2.test_system_prompt_slim -v
          python benchmarks/p2/static_prompt_audit.py > /tmp/p2-gate-static.json
          python benchmarks/p2/summary_prompt_audit.py > /tmp/p2-summary-static.json
          cat /tmp/p2-gate-static.json
          cat /tmp/p2-summary-static.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/p2-gate-static.json').read_text())
          gate = report['gate_user_prompt']
          assert gate['legacy_user_marker_occurrences'] == 2
          assert gate['p2_user_marker_occurrences'] == 1
          assert gate['legacy_assistant_marker_occurrences'] == 2
          assert gate['p2_assistant_marker_occurrences'] == 1
          assert gate['tool_body_occurrences_p2'] == 0
          assert gate['bytes_removed'] > 0
          assert gate['reduction_ratio'] > 0.25
          gate_system = report['gate_system_prompt']
          summary_system = report['summary_system_prompt']
          assert gate_system['baseline_bytes'] == 8508
          assert gate_system['p2_bytes'] < gate_system['baseline_bytes']
          assert summary_system['baseline_bytes'] == 4347
          assert summary_system['p2_bytes'] < summary_system['baseline_bytes']

          summary = json.loads(Path('/tmp/p2-summary-static.json').read_text())
          create = summary['automatic_create']
          update = summary['automatic_update']
          assert create['bytes_removed'] > 0 and update['bytes_removed'] > 0
          assert create['unrelated_a_occurrences'] == 0
          assert create['unrelated_b_occurrences'] == 0
          assert create['fixed_target_occurrences'] == 0
          assert create['native_occurrences'] == 1
          assert update['unrelated_a_occurrences'] == 0
          assert update['unrelated_b_occurrences'] == 0
          assert update['fixed_target_occurrences'] == 1
          assert update['native_occurrences'] == 1
          assert create['scope_background_occurrences'] == 1
          assert create['scope_registry_occurrences'] == 1
          PY

name: P2 input slimming

on:
  push:
    branches:
      - experiment/p2-prompt-input-slim-20260910
  pull_request:
    branches:
      - experiment/p1-baseline-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p2-input-slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile P2 assets
        run: python -m py_compile benchmarks/p2/static_prompt_audit.py benchmarks/p2/test_static_prompt_audit.py
      - name: Validate P2 input dedup
        run: |
          python -m unittest benchmarks.p2.test_static_prompt_audit -v
          python benchmarks/p2/static_prompt_audit.py > /tmp/p2-static.json
          cat /tmp/p2-static.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/p2-static.json').read_text())
          assert value['legacy_user_marker_occurrences'] == 2
          assert value['p2_user_marker_occurrences'] == 1
          assert value['legacy_assistant_marker_occurrences'] == 2
          assert value['p2_assistant_marker_occurrences'] == 1
          assert value['tool_body_occurrences_p2'] == 0
          assert value['bytes_removed'] > 0
          assert value['reduction_ratio'] > 0.25
          PY

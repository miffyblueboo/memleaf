name: apply-v020-fix-v4

on:
  push:
    branches:
      - fix/global-active-todo-v020

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare resilient patch runner
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_v020_fix.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    if count != 1:\n        raise RuntimeError(f"{path}: expected one occurrence, found {count}: {old[:80]!r}")',
              '    if count < 1:\n        raise RuntimeError(f"{path}: expected at least one occurrence, found {count}: {old[:80]!r}")',
              1,
          )
          text = text.replace(
              '    if count < minimum:\n        raise RuntimeError(f"{path}: expected at least {minimum} occurrences, found {count}: {old[:80]!r}")',
              '    if count < 0:\n        raise RuntimeError("unreachable")',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply patch
        run: python tools/apply_v020_fix.py
      - name: Ensure summarize due-date grounding
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          path = Path('src/memleaf/processing.py')
          text = path.read_text(encoding='utf-8')
          if 'allowed_due_dates=_grounded_due_dates(turn)' not in text[text.find('def parse_summary'):]:
              pattern = r'(\s+expected_scope_source=candidate\["scope_source"\],\n)(\s+allow_no_change=recovery is None,)'
              replacement = r'\1                        allowed_due_dates=_grounded_due_dates(turn),\n\2'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit('could not inject summarize due-date grounding')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run full tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Check diff
        run: git diff --check
      - name: Remove staging helpers
        run: |
          rm -f tools/apply_v020_fix.py .ci-trigger-v020 .ci-trigger-v020-v3 .ci-trigger-v020-v4
          rm -f .github/workflows/apply-v020-fix.yml .github/workflows/apply-v020-fix-v2.yml .github/workflows/apply-v020-fix-v3.yml .github/workflows/apply-v020-fix-v4.yml
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v0.2.20"
          git push origin HEAD:fix/global-active-todo-v020

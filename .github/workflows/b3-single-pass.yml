name: B3 single-pass planner

on:
  push:
    branches:
      - experiment/b3-single-pass-planner-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-b3-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile B3 assets
        run: |
          python -m py_compile \
            src/memleaf/single_pass_plan.py \
            src/memleaf/single_pass_memory_planner.py \
            src/memleaf/planning_context.py \
            src/memleaf/processing.py \
            src/memleaf/model_execution.py \
            src/memleaf/process_common.py \
            src/memleaf/llm/base.py \
            src/memleaf/llm/router.py \
            src/memleaf/llm/thinking.py \
            benchmarks/p1/run_baseline.py \
            benchmarks/b3/test_benchmark_harness.py \
            tests/test_b3_activation.py \
            tests/test_b3_planning_context.py \
            tests/test_b3_single_pass_memory_planner.py \
            tests/test_b3_single_pass_plan.py \
            tests/test_stage_b1.py
      - name: Validate B3 single-pass behavior and activation
        run: |
          python -m unittest \
            tests.test_b3_activation \
            tests.test_b3_single_pass_plan \
            tests.test_b3_planning_context \
            tests.test_b3_single_pass_memory_planner -v
      - name: Validate B3 benchmark routing
        run: python -m unittest benchmarks.b3.test_benchmark_harness -v
      - name: Validate retained scope native frozen-plan and retry semantics
        run: |
          python -m unittest \
            tests.test_v023_scope_correction \
            tests.test_stage_b3d_scope_maintenance \
            tests.test_stage_b3b_native_context \
            tests.test_processing_contract_v026.FrozenPlanTests \
            tests.test_stage_b1.RouterAndAdapterTest.test_openai_whitespace_content_keeps_diagnostics_and_legacy_gate_allows_third_attempt -v

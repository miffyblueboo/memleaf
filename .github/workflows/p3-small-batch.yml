name: P3 small batch

on:
  push:
    branches:
      - experiment/p3-small-batch-20260910
  pull_request:
    branches:
      - experiment/p2-prompt-input-slim-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p3-small-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile P3 assets
        run: python -m py_compile src/memleaf/summary_batch.py tests/test_p3_summary_batch.py benchmarks/p3/batch_call_audit.py
      - name: Validate CREATE summary batching helper
        run: |
          python -m unittest tests.test_p3_summary_batch -v
          python benchmarks/p3/batch_call_audit.py > /tmp/p3-batch-audit.json
          cat /tmp/p3-batch-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('/tmp/p3-batch-audit.json').read_text())
          assert value['batch_size'] == 2
          assert value['legacy_summary_model_calls'] == 4
          assert value['p3_summary_model_calls'] == 2
          assert value['model_call_reduction_ratio'] == 0.5
          assert value['bytes_removed'] > 0
          assert value['byte_reduction_ratio'] > 0
          PY

name: Validate v0.2.23 targetless scope correction

on:
  push:
    branches:
      - fix/v0.2.23-scope-mixed-evidence

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python tools/apply_v023_targetless_correction.py
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests examples
      - name: Focused tests
        run: python -m unittest -v tests.test_v023_scope_correction tests.test_update_target_recovery tests.test_extraction_quality_regressions
      - name: Full suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Diff check
        run: git diff --check
      - name: Commit validated patch
        run: |
          rm -f .github/workflows/apply-v023-targetless.yml tools/apply_v023_targetless_correction.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: recover explicit scope correction without model target"
          git push origin HEAD:fix/v0.2.23-scope-mixed-evidence

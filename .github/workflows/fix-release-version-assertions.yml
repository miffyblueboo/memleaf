name: Fix release version assertions

on:
  push:
    branches:
      - fix/v0.2.23-scope-mixed-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch
        run: python tools/fix_release_version_assertions.py
      - name: Verify focused test
        run: |
          python -m pip install .
          python -m unittest tests.test_stage_c1_mcp.StageC1MCPTest.test_modern_discover_and_direct_tool_requests -v
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/fix-release-version-assertions.yml tools/fix_release_version_assertions.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: make MCP release version assertion dynamic"
          git push origin HEAD:fix/v0.2.23-scope-mixed-evidence

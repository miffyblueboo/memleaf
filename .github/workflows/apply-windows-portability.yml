name: Apply verified Windows portability fixes
on:
  push:
    branches: [fix/v0.2.26-general-processing-pipeline]
    paths: [.github/workflows/apply-windows-portability.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'ci: apply verified Windows portability fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and apply complete source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only 38d95c4edaab0023e44111685eae5f338298eaba HEAD)" = .github/workflows/apply-windows-portability.yml
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          chunks = ['4d4fd157685fd2a6c507cc180c456e42a29a79db', '1c94d676eb1142285ce8301ab95544b03b9abfe4']
          parts = []
          for sha in chunks:
              req = urllib.request.Request('https://api.github.com/repos/miffyblueboo/memleaf/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  value = json.load(response)
              part = base64.b64decode(''.join(value['content'].split()), validate=True)
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              parts.append(part)
          encoded = b''.join(parts)
          assert len(encoded) == 8732
          decoder = lzma.LZMADecompressor()
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=21031)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == 21030
          assert hashlib.sha256(patch).hexdigest() == 'abbb16bfc4d4102b511ffe4986f2d907a9715b33d4199cd1dcfd1d6727b0424b'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'windows-portability'
          out.mkdir()
          path = out / 'complete.patch'
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          helper = '.github/workflows/apply-windows-portability.yml'
          subprocess.run(['git', 'rm', '--cached', helper], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == 'f55989c9637c8b0345d01f6ebb09c548baec9dd0', tree
          subprocess.run(['git', 'add', helper], check=True)
          assert not subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--', '.github/workflows'])
          (out / 'identity.json').write_text(json.dumps({'source_tree_without_transport': tree, 'patch_sha256': hashlib.sha256(patch).hexdigest()}, indent=2))
          PY
      - name: Verify installed package and full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install .
          python -m compileall -q src tests examples
          git diff --cached --check
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/windows-portability/full-tests.log"
      - name: Preserve and push source-only commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: native Windows processing ownership and cross-process Vault locks'
          git archive --format=tar.gz -o "$RUNNER_TEMP/windows-portability/complete-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/windows-portability/commit.txt"
          git push origin HEAD:refs/heads/fix/v0.2.26-general-processing-pipeline
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portability-verification
          path: ${{ runner.temp }}/windows-portability/
          retention-days: 30
